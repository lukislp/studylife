# Policy of the lktec-bot GitHub App for this repository. Committed to the default branch: the
# bot reads it from there, never from a pull request. See docs/modules/automerge.md in
# lukislp/lktec-bot for every key.
version: 1
modules:
  automerge:
    enabled: true
    # patch, minor and digest updates are armed; manual leaves majors to a person.
    majors: manual
    # auto arms a pull request that changes .github/workflows/; manual leaves it to a person.
    workflow-files: auto
    # How GitHub merges once the checks are green.
    method: squash
    # Merge a pull request GitHub refuses to arm because it is already mergeable (merge verb,
    # lktec-bot v0.9.0): only that case, bound to the approved head, never an admin merge.
    merge-ready: true
    # Dependency names (exact, case-insensitive) that are never approved or armed.
    exclude: []

  # Commits the lock files that the lockfiles workflow regenerated for a Dependabot pull request
  # (see docs/modules/lockfiles.md in lukislp/lktec-bot).
  lockfiles:
    enabled: true
    # Default (empty): every supported ecosystem. Supported: uv (uv.lock), dotnet (packages.lock.json).
    ecosystems: []
    # Default (empty): the whole repository.
    paths: []
    # One line; {number} is the pull request number.
    commit-message: "chore(deps): refresh lockfiles after Dependabot bump"
    # Regenerated with the lock files of a Dependabot pull request (lktec-bot v0.10.0, see
    # docs/modules/lockfiles.md there): a bump that adds or drops a transitive package changes the
    # third-party notices, and test-lint fails until they are current. The command comes from this
    # file on the default branch and runs without secrets; only the listed path is committed.
    derived:
      - name: third-party notices
        run: python3 tools/check-licences.py --update
        paths: [THIRD-PARTY-NOTICES.md]

  # Commits the image tag bump of the deploy manifests onto the default branch after a release (see
  # docs/modules/sync.md in lukislp/lktec-bot). The App is a bypass actor of the branch ruleset for it.
  sync:
    enabled: true
    paths: [k8s, .github/badges]
    branch: main
    commit-message: "chore(deploy): image {version} [skip ci]"

  # Tags and publishes a release from the Conventional Commits on the default branch (see
  # docs/modules/release.md in lukislp/lktec-bot).
  release:
    enabled: true
    mode: tag
    tag-format: "v{version}"
    branch: main
    # Only used while no tag matches tag-format.
    first-version: "1.0.0"
    # The rules .releaserc.json carried: a refactor is a patch release. The breaking rule comes
    # first so that a breaking refactor stays a major release (the old setup took the highest
    # match; here the first matching rule wins). Defaults after these: feat minor, fix/perf/revert
    # patch, everything else nothing.
    rules:
      - { breaking: true, release: major }
      - { type: refactor, release: patch }
