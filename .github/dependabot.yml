# Weekly dependency PRs for the three ecosystems this repo builds from (2026-09 audit M10). The
# semantic-release toolchain lives in lukislp/ci-workflows and is bumped there.
# Actions are SHA-pinned in ci-cd.yml; Dependabot keeps the pins moving instead of them rotting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
      # The client's runtime library and the source generator wrapped by
      # src/StudyLife.I18nTextGenerator must stay on the same release (the build fails with
      # SLI18N002 otherwise), so they are bumped in one PR.
      i18ntext:
        patterns: ["Toolbelt.Blazor.I18nText*"]
    ignore:
      # Microsoft.CodeAnalysis.CSharp is the compile-time API of src/StudyLife.I18nTextGenerator.
      # It must not be newer than the compiler in the oldest supported .NET SDK (CS9057), so it
      # stays on a deliberately old version and is only raised by hand.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      # Microsoft.OpenApi is only pinned to lift a vulnerable transitive 2.0.0; ASP.NET Core
      # OpenApi 10.x requires < 3.0.0 and its source generator does not compile against 3.x.
      # Revisit with the .NET 11 upgrade.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  - package-ecosystem: docker
    directory: /src/StudyLife.Server
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
