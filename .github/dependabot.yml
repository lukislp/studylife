# Weekly dependency PRs for the three ecosystems this repo builds from (2026-09 audit M10).
# Actions are SHA-pinned in ci-cd.yml; Dependabot keeps the pins moving instead of them rotting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: docker
    directory: /src/StudyLife.Server
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
