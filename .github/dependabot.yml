# Weekly dependency PRs for the three ecosystems this repo builds from (2026-09 audit M10). The
# release chain lives in the lktec-bot App (lukislp/lktec-bot), which is pinned in ci-cd.yml.
# Actions are SHA-pinned in ci-cd.yml; Dependabot keeps the pins moving instead of them rotting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # A new release waits three days before Dependabot proposes it, except the lktec-bot
    # workflows: those are our own and a fix there should reach every caller right away.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/lktec-bot*"
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # Same for the lktec-bot workflows (automerge, lockfiles, release): one PR per release.
      lktec-bot:
        patterns:
          - "lukislp/lktec-bot*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
      # The client's runtime library and the source generator wrapped by
      # src/StudyLife.I18nTextGenerator must stay on the same release (the build fails with
      # SLI18N002 otherwise), so they are bumped in one PR.
      i18ntext:
        patterns: ["Toolbelt.Blazor.I18nText*"]
    ignore:
      # Microsoft.CodeAnalysis.CSharp is the compile-time API of src/StudyLife.I18nTextGenerator.
      # It must not be newer than the compiler in the oldest supported .NET SDK (CS9057), so it
      # stays on a deliberately old version and is only raised by hand.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      # Microsoft.OpenApi is only pinned to lift a vulnerable transitive 2.0.0; ASP.NET Core
      # OpenApi 10.x requires < 3.0.0 and its source generator does not compile against 3.x.
      # Revisit with the .NET 11 upgrade.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # Stay on the .NET 10 LTS line: .NET 10 and .NET 11 both end support on 2028-11-14, so 11 brings
      # nothing. Only the 11.x line is skipped; the range ends below 12, so .NET 12 (next LTS, November
      # 2027) is proposed normally and nothing has to be removed then.
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: ["11.*"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: ["11.*"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: ["11.*"]
      - dependency-name: "System.*"
        versions: ["11.*"]
      - dependency-name: "dotnet-ef"
        versions: ["11.*"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        versions: ["11.*"]
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  - package-ecosystem: docker
    directory: /src/StudyLife.Server
    schedule:
      interval: daily
    ignore:
      # Stay on the .NET 10 LTS line: .NET 10 and .NET 11 both end support on 2028-11-14, so 11 brings
      # nothing. Only the 11.x line is skipped; the range ends below 12, so .NET 12 (next LTS, November
      # 2027) is proposed normally and nothing has to be removed then.
      - dependency-name: "dotnet/aspnet"
        versions: [">= 11.0.0, < 12.0.0"]
      - dependency-name: "dotnet/sdk"
        versions: [">= 11.0.0, < 12.0.0"]
      - dependency-name: "dotnet/runtime"
        versions: [">= 11.0.0, < 12.0.0"]
      - dependency-name: "dotnet/runtime-deps"
        versions: [">= 11.0.0, < 12.0.0"]
    commit-message:
      prefix: "fix(docker)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
  # The Codespaces dev container: the features in .devcontainer/devcontainer.json, pinned by
  # .devcontainer/devcontainer-lock.json. The "image" (mcr.microsoft.com/devcontainers/dotnet:10.0)
  # stays on its major.minor tag by design. All feature bumps share one PR. Dev tooling only, so
  # the ci prefix releases nothing.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    groups:
      devcontainer-features:
        patterns:
          - "*"
