name: Dynamic analysis (OWASP ZAP)

# Dynamic application security testing against a running StudyLife container: the latest
# released image is started as a single container (SQLite, in-memory cache - the documented
# `docker run` deployment) and OWASP ZAP runs
#   1. a baseline scan (passive: headers, cookies, information leaks) of the web app, and
#   2. an API scan driven by the committed OpenAPI contract (docs/api/openapi.json), which also
#      sends active attack payloads (injection, path traversal, ...) to every documented
#      endpoint.
# Most endpoints need a passkey session, so the API scan mostly exercises the
# unauthenticated surface and the authentication layer's rejection paths - that is the
# boundary an anonymous attacker sees (docs/SECURITY-ASSURANCE.md, TB1/TB3).
#
# Two legs run the same scans:
#   release     the released image, exactly what users deploy.
#   assertions  an image built from this commit with the same Dockerfile, but from a Debug
#               publish, so the server's run-time assertions (Debug.Assert on invariants such
#               as tenant isolation, session validity and the SSRF guard) are compiled in.
#               Failed assertions are written to stderr (src/StudyLife.Server/Diagnostics/
#               AssertionTraceListener.cs) and this leg FAILS if the container log contains
#               one, or if the container died during the scan. Release builds compile the
#               assertions away, so production behaviour is unchanged.
#
# Weekly and on demand, plus on changes to this file; never against the public demo
# (SECURITY.md asks reporters not to scan it either). ZAP findings themselves are
# non-blocking: the reports are uploaded as an artifact and summarised in the job summary,
# and findings are triaged like any other report. Only GitHub-owned actions and the already
# allow-listed harden-runner are used; ZAP itself runs from its official container image, so
# no new third-party action is needed.
on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:
    inputs:
      image:
        description: "Image to scan in the release leg"
        required: false
        default: "ghcr.io/lukislp/studylife-server:latest"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dast.yml

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: zap (${{ matrix.build }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: [release, assertions]
    env:
      BUILD: ${{ matrix.build }}
      IMAGE: ${{ matrix.build == 'assertions' && 'studylife-server:assertions' || github.event.inputs.image || 'ghcr.io/lukislp/studylife-server:latest' }}
      # Written by src/StudyLife.Server/Diagnostics/AssertionTraceListener.cs.
      ASSERTIONS_ENABLED_MARKER: STUDYLIFE-ASSERTIONS-ENABLED
      ASSERTION_FAILED_MARKER: STUDYLIFE-ASSERTION-FAILED
      # Official ZAP image at a fixed release (not the moving "stable" tag), so a scan result
      # can be tied to a scanner version; bump deliberately. An outdated scanner shows up as
      # its own Low alert ("ZAP is Out of Date") in both reports.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0
      # Kestrel only speaks plain HTTP and redirects anything that did not come through a
      # TLS-terminating proxy to https://:443 (Program.cs, UseHttpsRedirection) - exactly what
      # production does. ZAP therefore plays the proxy: a replacer rule adds
      # X-Forwarded-Proto: https to every request (the container sees ZAP from the Docker
      # bridge, an RFC1918 address the default ForwardedHeaders trust list accepts), so the
      # scan reaches the real application instead of the redirect.
      ZAP_OPTIONS: >-
        -config replacer.full_list(0).description=forwarded-proto
        -config replacer.full_list(0).enabled=true
        -config replacer.full_list(0).matchtype=REQ_HEADER
        -config replacer.full_list(0).matchstr=X-Forwarded-Proto
        -config replacer.full_list(0).regex=false
        -config replacer.full_list(0).replacement=https
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # Audit, not block: ZAP fetches its add-on index at startup, and a scanner that
          # silently loses rules to a blocked endpoint is worse than one that is observed.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.build == 'assertions'
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.build == 'assertions'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # Same publish command and Dockerfile as the release job in ci-cd.yml, only with
      # --configuration Debug: that defines DEBUG, which keeps the Debug.Assert calls in the
      # binaries and installs the stderr assertion listener at startup.
      - name: Build assertion-enabled image (Debug configuration)
        if: matrix.build == 'assertions'
        run: |
          dotnet publish src/StudyLife.Server/StudyLife.Server.csproj --configuration Debug \
            --runtime linux-x64 --no-self-contained --output publish/amd64
          docker buildx build --load --platform linux/amd64 \
            -f src/StudyLife.Server/Dockerfile -t "$IMAGE" .
      - name: Start StudyLife (single container)
        run: |
          docker run -d --name studylife -p 8080:8080 \
            -e ASPNETCORE_URLS=http://+:8080 \
            "$IMAGE"
          # 120s: the Debug build of the assertions leg starts noticeably slower than Release.
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/healthz/ready >/dev/null; then
              echo "ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz/ready
          echo "Scanning ($BUILD) $(curl -fsS http://localhost:8080/api/system/version)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker logs studylife > startup.log 2>&1
          if [ "$BUILD" = assertions ] && ! grep -q "^$ASSERTIONS_ENABLED_MARKER:" startup.log; then
            echo "::error::The assertions leg is not running an assertion-enabled build ($ASSERTIONS_ENABLED_MARKER missing from the log)."
            exit 1
          fi
      - name: Prepare ZAP work directory
        run: |
          mkdir -p zap
          cp docs/api/openapi.json zap/openapi.json
          chmod -R 777 zap
      - name: ZAP baseline scan (passive)
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:8080 -I \
            -r baseline.html -J baseline.json -m 3 -z "$ZAP_OPTIONS"
      - name: ZAP API scan (active, OpenAPI)
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -O http://localhost:8080 -I \
            -r api.html -J api.json -z "$ZAP_OPTIONS"
      - name: Summarise findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          out = [f"### OWASP ZAP findings ({os.environ['BUILD']} build)", "", "| Scan | High | Medium | Low | Informational |", "|---|---|---|---|---|"]
          names = {"3": "High", "2": "Medium", "1": "Low", "0": "Informational"}
          details = []
          for scan in ("baseline", "api"):
              path = pathlib.Path("zap") / f"{scan}.json"
              if not path.exists():
                  out.append(f"| {scan} | - | - | - | - (no report) |")
                  continue
              counts = {k: 0 for k in names}
              for site in json.loads(path.read_text(encoding="utf-8")).get("site", []):
                  for alert in site.get("alerts", []):
                      risk = str(alert.get("riskcode", "0"))
                      counts[risk] = counts.get(risk, 0) + 1
                      if risk in ("3", "2"):
                          details.append(f"- {scan}: [{names[risk]}] {alert.get('name')} ({alert.get('count', '?')} instances)")
              out.append(f"| {scan} | {counts['3']} | {counts['2']} | {counts['1']} | {counts['0']} |")
          if details:
              out += ["", "High and medium alerts:", ""] + details
          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)
          EOF
      # The gate of the assertions leg: every request ZAP sent ran through the asserted code
      # paths, so any failure line in the log is a violated invariant. A container that is no
      # longer running is a failure too (an unhandled crash, or an assertion that slipped past
      # the listener and failed fast).
      - name: Check run-time assertions
        if: always() && matrix.build == 'assertions'
        run: |
          docker logs studylife > container.log 2>&1 || true
          failures=$(grep -c "^$ASSERTION_FAILED_MARKER:" container.log || true)
          running=$(docker inspect -f '{{.State.Running}}' studylife 2>/dev/null || echo false)
          {
            echo "### Run-time assertions"
            echo ""
            echo "| Assertion-enabled build | Failed assertions | Container still running |"
            echo "|---|---|---|"
            echo "| $(grep -q "$ASSERTIONS_ENABLED_MARKER" container.log && echo yes || echo no) | $failures | $running |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$failures" != 0 ]; then
            echo "::error::$failures run-time assertion(s) failed during the scan:"
            grep -A 25 "^$ASSERTION_FAILED_MARKER:" container.log
            exit 1
          fi
          if [ "$running" != true ]; then
            echo "::error::The StudyLife container stopped during the scan."
            tail -n 100 container.log
            exit 1
          fi
      - name: Container log
        if: always()
        run: docker logs studylife 2>&1 | tail -n 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-reports-${{ matrix.build }}
          path: zap/*.html
          retention-days: 30
