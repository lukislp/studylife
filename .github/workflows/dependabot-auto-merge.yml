name: Dependabot auto-merge

# Merges Dependabot patch and minor updates once every required check is green; majors stay
# manual. Runs on pull_request_target so the base branch's workflow definition and the repo
# secrets apply (a Dependabot-triggered pull_request run gets neither). Merges with
# AUTOMERGE_TOKEN, a fine-grained PAT (contents + pull requests: write): a merge performed with
# GITHUB_TOKEN would never start the release workflow, because GitHub does not run workflows for
# events caused by GITHUB_TOKEN. Deliberately no checkout - PR code is never executed here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # main requires pull requests to be up to date before they merge (ruleset). Every push to
  # main therefore leaves the open Dependabot PRs "behind"; the update-stale job below brings
  # them back onto the tip so their auto-merge can proceed without a manual rebase.
  push:
    branches: [main]

# GITHUB_TOKEN only reads PR metadata; the merge itself runs with AUTOMERGE_TOKEN (above).
permissions:
  pull-requests: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_TOKEN == 'true' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
      - if: env.HAS_TOKEN != 'true'
        run: echo "AUTOMERGE_TOKEN is not set - leaving this PR for a manual merge"

  update-stale:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
        # Only PRs that have auto-merge enabled are brought up to date - those are the ones that
        # would otherwise stall; a PR left for a manual merge (major bump) is updated by whoever
        # merges it. GitHub computes the merge state lazily after a push, so UNKNOWN is polled
        # for a while before the PR is treated as up to date.
        run: |
          for n in $(gh pr list --repo "$REPO" --author app/dependabot --state open --json number,autoMergeRequest                      --jq '.[] | select(.autoMergeRequest != null) | .number'); do
            for attempt in 1 2 3 4 5 6; do
              state="$(gh pr view "$n" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)"
              [ "$state" != "UNKNOWN" ] && break
              sleep 10
            done
            echo "#$n: $state"
            if [ "$state" = "BEHIND" ]; then
              gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null && echo "  updated onto main" || echo "::warning::could not update #$n"
            fi
          done
