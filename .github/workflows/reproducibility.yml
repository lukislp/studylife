name: Reproducible build check

# Publishes the server (linux-x64, the same command the release job uses for server.zip) twice
# from clean trees of the same commit and compares every output file byte for byte
# (scripts/compare_builds.py). Known, documented exceptions are listed with --known below and
# explained in docs/REPRODUCIBLE-BUILDS.md; ANY other difference fails the run, so a new source
# of non-determinism shows up the first time it is introduced.
#
# Weekly, on demand, and on pull requests that touch the build inputs. Not a required check.
on:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reproducibility.yml
      - scripts/compare_builds.py
      - Directory.Build.props
      - "**/*.csproj"
      - "**/packages.lock.json"
      - global.json

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NUGET_ENABLE_ENHANCED_HTTP_RETRY: "true"
  NUGET_ENHANCED_MAX_NETWORK_TRY_COUNT: "8"
  NUGET_ENHANCED_NETWORK_RETRY_DELAY_MILLISECONDS: "2000"
  DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
  VERSION: 0.0.0-reproducibility

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet workload restore StudyLife.sln
      - name: First build
        run: |
          dotnet restore StudyLife.sln --locked-mode
          dotnet publish src/StudyLife.Server/StudyLife.Server.csproj --configuration Release \
            --runtime linux-x64 --no-self-contained -p:Version="$VERSION" --output "$RUNNER_TEMP/build-a"
      - name: Clean the tree
        run: git clean -xdfq && git status --short
      - name: Second build
        run: |
          dotnet restore StudyLife.sln --locked-mode
          dotnet publish src/StudyLife.Server/StudyLife.Server.csproj --configuration Release \
            --runtime linux-x64 --no-self-contained -p:Version="$VERSION" --output "$RUNNER_TEMP/build-b"
      # Known exception (docs/REPRODUCIBLE-BUILDS.md, "Known gap"): the Blazor client assembly
      # differs between clean builds although all of its generated sources are identical; the
      # files below are that assembly, the server assembly/PDB that record its MVID, and the
      # static-web-asset manifests that carry its content hash.
      - name: Compare
        run: |
          python3 scripts/compare_builds.py "$RUNNER_TEMP/build-a" "$RUNNER_TEMP/build-b" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --known 'StudyLife.Client.dll' --known 'StudyLife.Client.pdb' \
            --known 'StudyLife.Server.dll' --known 'StudyLife.Server.pdb' \
            --known 'StudyLife.Server.staticwebassets.endpoints.json' \
            --known 'wwwroot/_framework/StudyLife.Client.*' \
            --known 'wwwroot/_framework/dotnet.js*' \
            --known 'wwwroot/service-worker*'
