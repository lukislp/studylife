            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore src/StudyLife.Server/StudyLife.Server.csproj --locked-mode
      # dotnet-ef is a local tool (.config/dotnet-tools.json), same pattern as reportgenerator in
      # test-unit above - restoring the manifest hits the NuGet cache instead of a fresh global install.
      - run: dotnet tool restore
      - name: Fail if StudyLifeDb (SQLite) has model changes with no migration
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/StudyLife.Server/StudyLife.Server.csproj --context StudyLifeDb
      - name: Fail if StudyLifeDbPostgres has model changes with no migration
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/StudyLife.Server/StudyLife.Server.csproj --context StudyLifeDbPostgres
        env:
          Database__Provider: Postgres
          # Never actually connected to (see the job comment above) - only needs to parse as a
          # valid Npgsql connection string so service registration in Program.cs doesn't throw.
          Database__ConnectionString: "Host=localhost;Port=5432;Database=studylife-ci-dummy;Username=studylife;Password=studylife-ci-dummy"

