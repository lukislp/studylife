  # ---------------------------------------------------------------------
  # Version / publish / docker / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@f1dbc56e0810b5f78691019889fc76cf5423d7fa # v0.3.0
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  publish-server:
    needs: [build, get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      # The commit of this run: the release job cuts the release at exactly this commit and skips
      # when the branch has moved on, so server.zip (stamped with NEXT_VERSION) and the tag always
      # come from the same tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet workload restore StudyLife.sln
      # Reproducible release output (docs/REPRODUCIBLE-BUILDS.md): the commit time becomes the
      # Last-Modified of every static web asset instead of the build time, so a rebuild of the
      # release tag reproduces server.zip's contents bit for bit.
      - name: Use the commit time as SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Published per-architecture (amd64/arm64 folder names match Docker's TARGETARCH, not the
      # .NET RID) so the multi-arch Docker build can COPY the matching one instead of sharing a
      # single RID-specific build across both platforms - see src/StudyLife.Server/Dockerfile.
      - run: dotnet publish src/StudyLife.Server/StudyLife.Server.csproj --configuration ${{ env.CONFIGURATION }} --runtime linux-x64 --no-self-contained -p:Version=${{ env.NEXT_VERSION }} --output publish/amd64
      - run: dotnet publish src/StudyLife.Server/StudyLife.Server.csproj --configuration ${{ env.CONFIGURATION }} --runtime linux-arm64 --no-self-contained -p:Version=${{ env.NEXT_VERSION }} --output publish/arm64
      - run: cd publish/amd64 && zip -r ../server.zip . && cd ../..
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-output
          path: |
            publish/server.zip
            publish/amd64/
            publish/arm64/
          retention-days: 7

  docker-server:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg runs at native speed (same pattern as homelab-autodoc/UnifiProtectDashboard). The
    # .NET binaries still come prebuilt per-arch from publish-server (built ONCE, consumed by
    # both legs via TARGETARCH), so what stops being emulated here is the image assembly
    # itself (apt layer, voice/model downloads, layer packing). Each leg pushes by digest
    # only; docker-manifest-merge below writes the actual tags - which is also why the
    # release-chain concurrency group moved THERE: tag races can only happen where tags are
    # written, and keeping the group here would serialize the two legs against each other.
    #
    # Runs after the release job (not before, see that job) - so a build/push failure here
    # never leaves an orphaned, un-tagged GHCR image blocking every future release.
    needs: [get-version, publish-server, release, release-assets]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # The server image's apt-get (Ubuntu noble base) and the pinned piper/whisper model
          # downloads from Hugging Face (LFS redirects to *.hf.co) run inside the build. They were
          # served from the buildx layer cache until the 2026-09-23 base-image digest bump.
          # The arm64 leg's apt mirror is ports.ubuntu.com (archive/security.ubuntu.com only
          # serve amd64); its cached apt layer hid that until the 2026-10-14 digest bump (#339).
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            archive.ubuntu.com:80
            auth.docker.io:443
            *.blob.core.windows.net:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            *.data.mcr.microsoft.com:443
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            *.hf.co:443
            huggingface.co:443
            *.huggingface.co:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            ports.ubuntu.com:80
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            security.ubuntu.com:80
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-output
          path: publish
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/StudyLife.Server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.NEXT_VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    # trivy-server is a real gate now (2026-09 audit I1): the per-arch images are already pushed
    # by digest, but the version tag Flux watches only appears here - so a CRITICAL finding stops
    # the release BEFORE anything can auto-deploy, instead of being reported after the fact.
    needs: [get-version, docker-server, trivy-server]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same self-healing stale-tag semantics the single-job version had (see git history
      # for the full incident write-up): a version tag that exists WITHOUT this commit's
      # sha-tag is proof a parallel run's version race left stale content under it -
      # imagetools create below overwrites it with the right content either way; this step
      # only makes that visible instead of silent.
      - name: Check for a stale version tag (self-healing, does not block)
        id: check
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            if docker manifest inspect "${{ env.IMAGE }}:${SHA_TAG}" >/dev/null 2>&1; then
              echo "Tag ${{ env.NEXT_VERSION }} already reflects this exact commit ($SHA_TAG) - re-tagging below is a harmless no-op."
            else
              echo "::warning::registry tag ${{ env.NEXT_VERSION }} already exists but was NOT built from this commit (no matching $SHA_TAG) - a parallel run's version race left stale content under this tag. Overwriting it now with the correct content for $GITHUB_SHA."
            fi
          fi
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            -t "${{ env.IMAGE }}:${{ steps.check.outputs.sha_tag }}" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/studylife/\.github/workflows/ci-cd\.yml@refs/heads/main$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The image tag bump of the deploy manifests, committed onto the default branch by the lktec-bot App
  # (module sync: docs/modules/sync.md in lukislp/lktec-bot; the App is a bypass actor of the branch ruleset
  # for this one commit, which GitHub signs itself). Flux picks the new tag up from the branch.
  deploy-bump:
    needs: [get-version, release, docker-manifest-merge, test-unit]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/deploy-bump.yml@f1dbc56e0810b5f78691019889fc76cf5423d7fa # v0.3.0
    with:
      version: ${{ needs.release.outputs.version }}
      images: 'ghcr\.io/lukislp/studylife-server'
      paths: k8s
      branch: main
      handover-artifact: coverage-badge-handover
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  trivy-server:
    # Scans the amd64 image BY DIGEST (pushed untagged by docker-server) and blocks
    # docker-manifest-merge - i.e. the publication of the version tag Flux deploys - on any
    # CRITICAL finding (2026-09 audit I1). It used to run after the tag was already live with
    # exit-code 0, so a Critical CVE was in prod before anyone read the table. HIGH stays
    # report-only: the Ubuntu base image carries HIGH-rated OS packages most weeks, and blocking
    # on those would mean no releases at all until Canonical ships the fix.
    needs: [get-version, docker-server]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            *.blob.core.windows.net:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            *.data.mcr.microsoft.com:443
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-amd64
          path: /tmp/digests
      - name: Resolve amd64 digest reference
        run: echo "IMAGE_REF=${{ env.IMAGE }}@sha256:$(ls /tmp/digests | head -1)" >> "$GITHUB_ENV"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report HIGH and CRITICAL (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Cuts the release (tag + GitHub release) through the lktec-bot App. It runs before docker-server
  # (see that job's comment): the real tag/release must exist before anything is published under
  # that version. The release is made at the commit of this run and is skipped when the branch has
  # moved on since, so the tag and server.zip (built by publish-server from the same commit) always
  # come from the same tree. get-version is listed explicitly so its outputs are reachable here.
  release:
    needs: [get-version, publish-server]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@f1dbc56e0810b5f78691019889fc76cf5423d7fa # v0.3.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Everything that used to run in the old release job after the tag: attach server.zip to
  # the GitHub release, then sign it and attach the provenance. Signed release asset (OpenSSF
  # Scorecard "Signed-Releases"): the same keyless Sigstore signing the container images get,
  # applied to server.zip, plus GitHub build provenance. Both bundles are uploaded next to the
  # asset so a download can be verified offline:
  #   cosign verify-blob --bundle server.zip.sigstore.json \
  #     --certificate-identity-regexp '^https://github.com/lukislp/studylife/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com server.zip
  release-assets:
    needs: [get-version, release]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      # Keyless signing + build provenance for the release asset.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-output
          path: publish
      # The tag the App created must be the version server.zip was built (and stamped) as.
      - name: Check the released version against the built one
        env:
          BUILT_TAG: v${{ needs.get-version.outputs.version }}
        run: |
          if [ "$TAG" != "$BUILT_TAG" ]; then
            echo "::error::the release is '${TAG}', but server.zip was built as ${BUILT_TAG} - not signing a mismatched asset. That release has no signature or provenance; see SECURITY.md (Verifying releases)."
            exit 1
          fi
      - name: Attach server.zip to the release
        run: gh release upload "$TAG" "publish/server.zip#Server — Linux x64" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign server.zip and attach the signature bundle to the release
        run: |
          cosign sign-blob --yes --bundle publish/server.zip.sigstore.json publish/server.zip
          cosign verify-blob --bundle publish/server.zip.sigstore.json \
            --certificate-identity-regexp '^https://github.com/lukislp/studylife/\.github/workflows/ci-cd\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            publish/server.zip
          gh release upload "$TAG" publish/server.zip.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: publish/server.zip
      - name: Attach the build provenance to the release
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" publish/server.zip.intoto.jsonl
          gh release upload "$TAG" publish/server.zip.intoto.jsonl --clobber --repo "$GITHUB_REPOSITORY"

  # Every release must carry server.zip together with its Sigstore bundle and its build
  # provenance (OpenSSF Scorecard "Signed-Releases" checks the last five). Runs even when the
  # release-assets job failed, because a release can already be public by then - v3.24.0
  # went out that way with nothing but server.zip, and only a lower Scorecard noticed. Known,
  # explained exceptions live in scripts/release_guard.py (KNOWN_UNSIGNED) and SECURITY.md.
  verify-release-assets:
    needs: [get-version, release, release-assets]
    if: always() && github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The latest five releases carry the signature and the provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=10" > "$RUNNER_TEMP/releases.json"
          python3 scripts/release_guard.py assets --releases-json "$RUNNER_TEMP/releases.json" --window 5
