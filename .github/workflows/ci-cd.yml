      # Licence and copyright of every file (REUSE Specification, CONTRIBUTING.md "Licence
      # headers"): source files carry SPDX headers, REUSE.toml covers the rest. The tool is
      # installed from a hash-pinned requirements file.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: REUSE licence headers
        run: |
          python3 -m pip install --require-hashes --no-deps -r tools/reuse-requirements.txt
          reuse lint
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
