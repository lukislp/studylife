  build:
    # GitLab's stage model implicitly waits for the entire preceding "test" stage to succeed
    # before the "build" stage starts; needs: makes that explicit under GitHub's DAG model.
    # test-openapi-contract and test-ef-migrations were missing here (2026-09-11 audit): both
    # are described as gates but weren't in the release DAG, so a stale docs/api/openapi.json or
    # a missing Postgres twin migration still built, released and shipped to the cluster.
    needs: [test-unit, test-i18n, test-lint, test-security, test-openapi-contract, test-ef-migrations, test-k8s-manifests, test-compose-scale]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
