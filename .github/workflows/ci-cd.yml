name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each queued PR on top of the current main and needs the same
  # required checks on that temporary merge_group branch before it merges.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  # NuGet restores keep failing with NU1301 "Network is unreachable (api.nuget.org:443)" while
  # other projects of the same restore succeed (2026-10-23). Retry transient network errors
  # more and longer than NuGet's default, and keep .NET on IPv4: "unreachable" is what a
  # connect to an unrouted IPv6 address returns, and the egress allow-list resolves for IPv4.
  NUGET_ENABLE_ENHANCED_HTTP_RETRY: "true"
  NUGET_ENHANCED_MAX_NETWORK_TRY_COUNT: "8"
  NUGET_ENHANCED_NETWORK_RETRY_DELAY_MILLISECONDS: "2000"
  DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
  CONFIGURATION: Release
  IMAGE: ghcr.io/lukislp/studylife-server

permissions:
  contents: read
  actions: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # No `dotnet workload restore` here: every project in the test dependency graph is
      # plain net10.0 (Blazor WASM only needs the wasm-tools workload for AOT/relinking,
      # which the Client doesn't use - StudyLife.Client.Tests references the Client project
      # and builds fine without it), and installing workloads was the single most
      # expensive step of this job. One explicit solution restore up front so the four
      # test invocations below don't each pay their own implicit restore.
      - run: dotnet restore StudyLife.sln --locked-mode
      - run: dotnet test tests/StudyLife.Shared.Tests/StudyLife.Shared.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/shared-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - run: dotnet test tests/StudyLife.Server.Tests/StudyLife.Server.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/server-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - run: dotnet test tests/StudyLife.Tts.Tests/StudyLife.Tts.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/tts-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - run: dotnet test tests/StudyLife.Client.Tests/StudyLife.Client.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/client-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            tests/StudyLife.Shared.Tests/TestResults/shared-tests-junit.xml
            tests/StudyLife.Server.Tests/TestResults/server-tests-junit.xml
            tests/StudyLife.Tts.Tests/TestResults/tts-tests-junit.xml
            tests/StudyLife.Client.Tests/TestResults/client-tests-junit.xml
          retention-days: 7
      # Coverage badge (self-hosted, no external service): merges the projects' cobertura
      # reports, scoped to StudyLife.Server/StudyLife.Shared - StudyLife.Client stays
      # excluded: StudyLife.Client.Tests covers its service lifetimes and dialog markup, but
      # the bulk of that assembly is Blazor UI markup verified manually, so including it
      # would drag an otherwise well-tested number down into misleading territory. Uploaded as
      # the artifact `coverage-badge-handover` and handed to the deploy-bump job below, through which
      # the lktec-bot App commits it to .github/badges/coverage.json together with the image bump of
      # every release - cheaper than re-running the whole test+coverage pipeline there just for one
      # small JSON file.
      # The badge shows line AND branch coverage, truncated to one decimal (never rounded up).
      # EF Core migrations (StudyLife.Server.Migrations.*) are excluded as generated code:
      # the Designer model snapshots alone are ~21k coverable lines of machine-written
      # boilerplate that dwarf the ~4.3k lines of hand-written code and would pin the
      # number to ~80% forever regardless of how well the real code is tested. Other
      # generated code ([GeneratedCode]: the System.Text.Json source-gen context, ~15k
      # lines) is already dropped at collection time by coverlet.runsettings.
      # The repo already pins reportgenerator in .config/dotnet-tools.json - restoring the
      # manifest hits the NuGet cache above instead of re-downloading a global tool per run.
      - name: Unit tests for the coverage badge script
        run: python3 -m unittest discover -s scripts/tests
      - run: dotnet tool restore
      - run: >
          dotnet tool run reportgenerator
          -reports:"tests/**/TestResults/**/coverage.cobertura.xml"
          -targetdir:coverage-summary
          -reporttypes:JsonSummary
          -assemblyfilters:"-StudyLife.Client"
          -classfilters:"-StudyLife.Server.Migrations.*"
      # Line AND branch coverage go into the job summary on every run (branch coverage was
      # only ever measured by hand before); the badge itself stays line coverage.
      - run: python3 scripts/generate_coverage_badge.py coverage-summary/Summary.json coverage-badge.json --min-line 92 --min-branch 80
      # Report-only second view WITH StudyLife.Client, so the number the badge leaves out is
      # visible too instead of only being described as excluded. Never gates anything.
      - run: >
          dotnet tool run reportgenerator
          -reports:"tests/**/TestResults/**/coverage.cobertura.xml"
          -targetdir:coverage-summary-all
          -reporttypes:JsonSummary
          -classfilters:"-StudyLife.Server.Migrations.*"
      - name: Coverage including StudyLife.Client (report only)
        run: |
          python3 - <<'EOF'
          import json, os
          s = json.load(open("coverage-summary-all/Summary.json", encoding="utf-8"))["summary"]
          line = f"Including StudyLife.Client: line {s['linecoverage']:.1f}%, branch {s.get('branchcoverage') or 0:.1f}%"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"\n{line}\n")
          EOF
      - name: Hand the coverage badge over for the bot commit
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/badge-handover/files/.github/badges"
          cp coverage-badge.json "$RUNNER_TEMP/badge-handover/files/.github/badges/coverage.json"
          printf '%s\n' .github/badges/coverage.json > "$RUNNER_TEMP/badge-handover/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

