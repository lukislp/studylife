      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ghcr.io/yannh/kubeconform:latest-alpine -summary -ignore-missing-schemas k8s/
      # Audit finding O4: also validate what actually gets applied via Flux's Kustomization
      # (k8s/flux/deploy/), not just the raw files above - historically these differed (a patch
      # forced imagePullPolicy to "Always" there while the git-versioned files kept "Never"), and
      # even now that both commit "Always" directly, this keeps the two paths honest against each
      # other for any future divergence.
      # --load-restrictor LoadRestrictionsNone: k8s/flux/deploy/kustomization.yaml's resources
