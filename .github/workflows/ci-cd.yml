name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each queued PR on top of the current main and needs the same
  # required checks on that temporary merge_group branch before it merges.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  IMAGE: ghcr.io/lukislp/studylife-server

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # No `dotnet workload restore` here: every project in the test dependency graph is
      # plain net10.0 (Blazor WASM only needs the wasm-tools workload for AOT/relinking,
      # which the Client doesn't use - StudyLife.Client.Tests references the Client project
      # and builds fine without it), and installing workloads was the single most
      # expensive step of this job. One explicit solution restore up front so the four
      # test invocations below don't each pay their own implicit restore.
      - run: dotnet restore StudyLife.sln --locked-mode
      - run: dotnet test tests/StudyLife.Shared.Tests/StudyLife.Shared.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/shared-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - run: dotnet test tests/StudyLife.Server.Tests/StudyLife.Server.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/server-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - run: dotnet test tests/StudyLife.Tts.Tests/StudyLife.Tts.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/tts-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - run: dotnet test tests/StudyLife.Client.Tests/StudyLife.Client.Tests.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/client-tests-junit.xml" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            tests/StudyLife.Shared.Tests/TestResults/shared-tests-junit.xml
            tests/StudyLife.Server.Tests/TestResults/server-tests-junit.xml
            tests/StudyLife.Tts.Tests/TestResults/tts-tests-junit.xml
            tests/StudyLife.Client.Tests/TestResults/client-tests-junit.xml
          retention-days: 7
      # Coverage badge (self-hosted, no external service): merges the projects' cobertura
      # reports, scoped to StudyLife.Server/StudyLife.Shared - StudyLife.Client stays
      # excluded: StudyLife.Client.Tests covers its service lifetimes and dialog markup, but
      # the bulk of that assembly is Blazor UI markup verified manually, so including it
      # would drag an otherwise well-tested number down into misleading territory. Uploaded as an artifact and downloaded by the
      # semantic-release job below, which commits it to .github/badges/ on release - cheaper
      # than re-running the whole test+coverage pipeline there just for one small JSON file.
      # EF Core migrations (StudyLife.Server.Migrations.*) are excluded as generated code:
      # the Designer model snapshots alone are ~21k coverable lines of machine-written
      # boilerplate that dwarf the ~4.3k lines of hand-written code and would pin the
      # number to ~80% forever regardless of how well the real code is tested. Other
      # generated code ([GeneratedCode]: the System.Text.Json source-gen context, ~15k
      # lines) is already dropped at collection time by coverlet.runsettings.
      # The repo already pins reportgenerator in .config/dotnet-tools.json - restoring the
      # manifest hits the NuGet cache above instead of re-downloading a global tool per run.
      - run: dotnet tool restore
      - run: >
          dotnet tool run reportgenerator
          -reports:"tests/**/TestResults/**/coverage.cobertura.xml"
          -targetdir:coverage-summary
          -reporttypes:JsonSummary
          -assemblyfilters:"-StudyLife.Client"
          -classfilters:"-StudyLife.Server.Migrations.*"
      - run: python3 scripts/generate_coverage_badge.py coverage-summary/Summary.json coverage-badge.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7

  test-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python3 tools/check-i18n.py
      # Guards the InvariantGlobalization date-format trap (see the script header).
      - run: python3 tools/check-date-formats.py

  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet workload restore StudyLife.sln
      # Planner.razor / StudyPlanner.cs / PlannerController.cs are off-limits for reformatting
      # per project convention, so they're excluded rather than left to accumulate drift silently.
      - run: dotnet format StudyLife.sln --verify-no-changes --verbosity diagnostic --exclude src/StudyLife.Client/Pages/Planner.razor src/StudyLife.Shared/StudyPlanner.cs src/StudyLife.Server/Controllers/PlannerController.cs

  test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet workload restore StudyLife.sln
      - run: dotnet restore StudyLife.sln --locked-mode
      - name: Known-vulnerable NuGet packages (High/Critical fail the build)
        uses: lukislp/ci-workflows/.github/actions/nuget-severity-gate@d6ea7363956999dc7b3695e8b446f6361b102c6b # v1.5.4
        with:
          solution: StudyLife.sln

  test-openapi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore src/StudyLife.Server/StudyLife.Server.csproj --locked-mode
      - run: dotnet build src/StudyLife.Server/StudyLife.Server.csproj --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Fail if docs/api/openapi.json is stale
        run: |
          git diff --exit-code docs/api/openapi.json || {
            echo "::error::docs/api/openapi.json is out of sync with the built API - a controller/DTO change was made without regenerating the committed OpenAPI contract. Run 'dotnet build src/StudyLife.Server/StudyLife.Server.csproj' locally and commit the resulting docs/api/openapi.json.";
            exit 1;
          }

  # Audit finding O2: guards migration TWINNING. StudyLifeDb (SQLite) and StudyLifeDbPostgres
  # each need their OWN migration for every model change (separate migration histories, see
  # docs/SCALING.md "Deliberate Scope Cuts" - `Migrations/Postgres/`) - `dotnet ef migrations
  # has-pending-model-changes` compares the current model against the last migration's snapshot
  # WITHOUT touching a real database, so the fake Postgres connection string below only needs to
  # parse, never to connect. Same freshness-gate shape as test-openapi-contract above: a schema
  # change with a missing twin migration fails the PR instead of surfacing later as a runtime
  # `PendingModelChangesWarning`/drift between SQLite and Postgres. See Program.cs's
  # `EF.IsDesignTime` guard for why this doesn't also try to run this app's own startup
  # migration/seeding side effects.
  test-ef-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore src/StudyLife.Server/StudyLife.Server.csproj --locked-mode
      # dotnet-ef is a local tool (.config/dotnet-tools.json), same pattern as reportgenerator in
      # test-unit above - restoring the manifest hits the NuGet cache instead of a fresh global install.
      - run: dotnet tool restore
      - name: Fail if StudyLifeDb (SQLite) has model changes with no migration
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/StudyLife.Server/StudyLife.Server.csproj --context StudyLifeDb
      - name: Fail if StudyLifeDbPostgres has model changes with no migration
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/StudyLife.Server/StudyLife.Server.csproj --context StudyLifeDbPostgres
        env:
          Database__Provider: Postgres
          # Never actually connected to (see the job comment above) - only needs to parse as a
          # valid Npgsql connection string so service registration in Program.cs doesn't throw.
          Database__ConnectionString: "Host=localhost;Port=5432;Database=studylife-ci-dummy;Username=studylife;Password=studylife-ci-dummy"

  test-k8s-manifests:
    # No longer runs INSIDE the kubeconform container (that left no way to also reach `kubectl`,
    # needed for the kustomize-output check below) - kubeconform is invoked via `docker run`
    # instead, on the plain runner image, which already ships `kubectl` (used for `kubectl
    # kustomize`, no separate `kustomize` CLI install needed).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ghcr.io/yannh/kubeconform:latest-alpine -summary -ignore-missing-schemas k8s/
      # Audit finding O4: also validate what actually gets applied via Flux's Kustomization
      # (k8s/flux/deploy/), not just the raw files above - historically these differed (a patch
      # forced imagePullPolicy to "Always" there while the git-versioned files kept "Never"), and
      # even now that both commit "Always" directly, this keeps the two paths honest against each
      # other for any future divergence.
      # --load-restrictor LoadRestrictionsNone: k8s/flux/deploy/kustomization.yaml's resources
      # reference ../../04-web.yaml/../../05-worker.yaml (outside its own directory) - kustomize's
      # default safety restriction forbids that for a standalone `kubectl kustomize` invocation
      # (Flux's in-cluster kustomize-controller treats the whole Git checkout as its root instead,
      # so it never hits this - see docs/SCALING.md). Same workaround documented there for local
      # manual verification.
      - run: kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/flux/deploy | docker run --rm -i ghcr.io/yannh/kubeconform:latest-alpine -summary -ignore-missing-schemas -

  test-compose-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pure syntax/interpolation check (no startup) - catches broken YAML or wrong
      # variable references before someone tests "docker compose up" by hand.
      - run: docker compose -f docker-compose.scale.yml config > /dev/null

  build:
    # GitLab's stage model implicitly waits for the entire preceding "test" stage to succeed
    # before the "build" stage starts; needs: makes that explicit under GitHub's DAG model.
    # test-openapi-contract and test-ef-migrations were missing here (2026-09-11 audit): both
    # are described as gates but weren't in the release DAG, so a stale docs/api/openapi.json or
    # a missing Postgres twin migration still built, released and shipped to the cluster.
    needs: [test-unit, test-i18n, test-lint, test-security, test-openapi-contract, test-ef-migrations, test-k8s-manifests, test-compose-scale]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet workload restore StudyLife.sln
      - run: dotnet restore StudyLife.sln --locked-mode
      - run: dotnet build StudyLife.sln --configuration ${{ env.CONFIGURATION }} --no-restore

  # ---------------------------------------------------------------------
  # Version / publish / docker / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely - confirmed
    # live on the studylife-ai sibling repo (2026-08-12).
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      # ref: main (branch tip), NOT the push-event SHA: Flux's image-update automation commits
      # "[skip ci]" bumps to main that can land between the triggering push and this job actually
      # running (the concurrency group can queue it behind a whole release chain). semantic-release
      # then sees "local branch is behind the remote" on the event SHA and silently publishes
      # nothing - the entire release chain skips even though a releasable fix was just merged
      # (happened live: PR #64's fix produced no release). Analyzing the branch tip makes the
      # verdict immune to that race; the tip only ever differs by those [skip ci] yaml commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      # semantic-release runs from lukislp/ci-workflows' pinned toolchain (lock file in the action,
      # Dependabot bumps it there) instead of a registry install per run or a package.json here.
      # Ruleset bypass for the release commit (2026-09-11 audit, finding 2): main is protected by
      # a ruleset (pull request + green test stage) that the GitHub Actions app cannot be a
      # bypass actor for on a personal repository, so @semantic-release/git pushes over SSH as a
      # write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset - the push
      # then goes through the GITHUB_TOKEN https remote exactly as before. Both release jobs need
      # this: @semantic-release/git's verifyConditions runs `git push --dry-run` even in
      # get-version's dry-run mode. Setup: see enable-main-protection.sh next to the repo.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@a5f01cccfa7a63023b5a2f67993f771d856c0ee4 # v1.7.1
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      # The action derives new_release_version / new_release_published from semantic-release's
      # own dry-run log line and treats "no relevant changes" (which exits non-zero, observed
      # 2026-09-11 on a ci:-only push) as the expected no-release outcome, not a red job.
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@a5f01cccfa7a63023b5a2f67993f771d856c0ee4 # v1.7.1
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. publish-server/docker-server/docker-manifest-merge/trivy-server/semantic-release below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  publish-server:
    needs: [build, get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      # ref: main to match get-version's analysis target (see its checkout comment) - the
      # binaries stamped with NEXT_VERSION must be built from the same tree that version was
      # computed for, not from an event SHA that may be a [skip ci] Flux bump behind it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'StudyLife.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet workload restore StudyLife.sln
      # Published per-architecture (amd64/arm64 folder names match Docker's TARGETARCH, not the
      # .NET RID) so the multi-arch Docker build can COPY the matching one instead of sharing a
      # single RID-specific build across both platforms - see src/StudyLife.Server/Dockerfile.
      - run: dotnet publish src/StudyLife.Server/StudyLife.Server.csproj --configuration ${{ env.CONFIGURATION }} --runtime linux-x64 --no-self-contained -p:Version=${{ env.NEXT_VERSION }} --output publish/amd64
      - run: dotnet publish src/StudyLife.Server/StudyLife.Server.csproj --configuration ${{ env.CONFIGURATION }} --runtime linux-arm64 --no-self-contained -p:Version=${{ env.NEXT_VERSION }} --output publish/arm64
      - run: cd publish/amd64 && zip -r ../server.zip . && cd ../..
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-output
          path: |
            publish/server.zip
            publish/amd64/
            publish/arm64/
          retention-days: 7

  docker-server:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg runs at native speed (same pattern as homelab-autodoc/UnifiProtectDashboard). The
    # .NET binaries still come prebuilt per-arch from publish-server (built ONCE, consumed by
    # both legs via TARGETARCH), so what stops being emulated here is the image assembly
    # itself (apt layer, voice/model downloads, layer packing). Each leg pushes by digest
    # only; docker-manifest-merge below writes the actual tags - which is also why the
    # release-chain concurrency group moved THERE: tag races can only happen where tags are
    # written, and keeping the group here would serialize the two legs against each other.
    #
    # Runs after semantic-release (not before, see that job) - so a build/push failure here
    # never leaves an orphaned, un-tagged GHCR image blocking every future release.
    needs: [get-version, publish-server, semantic-release]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The server image's apt-get (Ubuntu noble base) and the pinned piper/whisper model
          # downloads from Hugging Face (LFS redirects to *.hf.co) run inside the build. They were
          # served from the buildx layer cache until the 2026-09-23 base-image digest bump.
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            archive.ubuntu.com:80
            auth.docker.io:443
            *.blob.core.windows.net:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            *.data.mcr.microsoft.com:443
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            *.hf.co:443
            huggingface.co:443
            *.huggingface.co:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            security.ubuntu.com:80
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-output
          path: publish
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/StudyLife.Server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.NEXT_VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    # trivy-server is a real gate now (2026-09 audit I1): the per-arch images are already pushed
    # by digest, but the version tag Flux watches only appears here - so a CRITICAL finding stops
    # the release BEFORE anything can auto-deploy, instead of being reported after the fact.
    needs: [get-version, docker-server, trivy-server]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same self-healing stale-tag semantics the single-job version had (see git history
      # for the full incident write-up): a version tag that exists WITHOUT this commit's
      # sha-tag is proof a parallel run's version race left stale content under it -
      # imagetools create below overwrites it with the right content either way; this step
      # only makes that visible instead of silent.
      - name: Check for a stale version tag (self-healing, does not block)
        id: check
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            if docker manifest inspect "${{ env.IMAGE }}:${SHA_TAG}" >/dev/null 2>&1; then
              echo "Tag ${{ env.NEXT_VERSION }} already reflects this exact commit ($SHA_TAG) - re-tagging below is a harmless no-op."
            else
              echo "::warning::registry tag ${{ env.NEXT_VERSION }} already exists but was NOT built from this commit (no matching $SHA_TAG) - a parallel run's version race left stale content under this tag. Overwriting it now with the correct content for $GITHUB_SHA."
            fi
          fi
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            -t "${{ env.IMAGE }}:${{ steps.check.outputs.sha_tag }}" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/studylife/\.github/workflows/ci-cd\.yml@refs/heads/main$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Image tag bump (2026-09-12): the deployment manifests pin the image by version, and this
  # job - no longer Flux's image-automation-controller - writes the released version into them
  # once the image exists, pushing over the same deploy key semantic-release uses. Flux then only
  # reads this repo (its GitRepository carries no write token any more) and applies whatever the
  # default branch says.
  deploy-bump:
    needs: [get-version, docker-manifest-merge]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Same deploy-key push as the release jobs - the default branch only takes direct pushes
      # from that key, so this job cannot fall back to GITHUB_TOKEN.
      - name: Push as the semantic-release deploy key
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@a5f01cccfa7a63023b5a2f67993f771d856c0ee4 # v1.7.1
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
          required: "true"
      - name: Point the manifests at the released image and push
        env:
          DEPLOY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: |
          set -eu
          for f in $(grep -rlE 'ghcr\.io/lukislp/studylife-server:' k8s --include='*.yaml' | grep -v '/flux/'); do
            sed -i -E "s#(ghcr\.io/lukislp/studylife-server):[0-9A-Za-z._-]+#\\1:${NEXT_VERSION}#g" "$f"
          done
          if git diff --quiet; then
            echo "manifests already reference ${NEXT_VERSION}"
            exit 0
          fi
          git diff --stat
          git config user.name "studylife-deploy"
          # GitHub's SSH signature verification also checks the committer email against the
          # signing key's owning account (like GPG) - a synthetic "@studylife.local" address
          # verifies the signature bytes fine but comes back "reason: no_user" (hit live
          # 2026-09-20, v3.17.3), since no account owns that address. Use the account's own
          # noreply email instead, matching what shows up as "verified" on every other commit here.
          git config user.email "155678024+lukislp@users.noreply.github.com"
          # SSH-sign this bot commit so it shows "Verified" (2026-09-20 audit): the deploy key
          # above only authenticates the push, it can't sign - GitHub auto-signs commits only when
          # it creates them itself via the API (as semantic-release's commits are), never a raw
          # `git commit`. This is a separate signing-only key registered on the account
          # (github.com/settings/keys), not the push-authorizing deploy key.
          signing_key="$RUNNER_TEMP/deploy_signing_key"
          printf '%s\n' "$DEPLOY_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          # git's ssh signing backend loads the *public* key from user.signingkey (not the
          # private key path directly) - without this .pub file alongside it, signing fails with
          # "Couldn't load public key ...: No such file or directory" (hit live 2026-09-20, v3.17.2).
          ssh-keygen -y -f "$signing_key" > "$signing_key.pub"
          git config gpg.format ssh
          git config user.signingkey "$signing_key.pub"
          git config commit.gpgsign true
          git commit -S -am "chore(deploy): image ${NEXT_VERSION} [skip ci]"
          # The branch may have moved (an out-of-band push) between checkout and now - rebase, retry.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the image tag bump"
          exit 1

  trivy-server:
    # Scans the amd64 image BY DIGEST (pushed untagged by docker-server) and blocks
    # docker-manifest-merge - i.e. the publication of the version tag Flux deploys - on any
    # CRITICAL finding (2026-09 audit I1). It used to run after the tag was already live with
    # exit-code 0, so a Critical CVE was in prod before anyone read the table. HIGH stays
    # report-only: the Ubuntu base image carries HIGH-rated OS packages most weeks, and blocking
    # on those would mean no releases at all until Canonical ships the fix.
    needs: [get-version, docker-server]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            *.blob.core.windows.net:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            *.data.mcr.microsoft.com:443
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-amd64
          path: /tmp/digests
      - name: Resolve amd64 digest reference
        run: echo "IMAGE_REF=${{ env.IMAGE }}@sha256:$(ls /tmp/digests | head -1)" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report HIGH and CRITICAL (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  semantic-release:
    # Runs before docker-server now (see that job's comment) - the real tag/release must exist
    # before anything is published under that version. get-version is now listed explicitly
    # (it wasn't before) rather than relied on transitively via docker-server/publish-server -
    # this job's own `if:` reads needs.get-version.outputs.published, which only GitHub's
    # documented needs-context semantics guarantee if get-version is an actual direct need.
    needs: [get-version, publish-server]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studylife-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Keyless signing + build provenance for the release asset (see the last steps).
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            auth.docker.io:443
            builds.dotnet.microsoft.com:443
            check.trivy.dev:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mcr.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            *.data.mcr.microsoft.com:443
      # ref: main for the same reason as get-version's checkout (see there): the real release
      # must be cut from the branch tip get-version analyzed, or the "behind the remote" guard
      # trips on the event SHA whenever a Flux [skip ci] bump raced in. The retry below still
      # covers pushes landing DURING this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-output
          path: publish
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
          path: coverage-artifact
      - run: mkdir -p .github/badges && mv coverage-artifact/coverage-badge.json .github/badges/coverage.json
      # semantic-release runs from lukislp/ci-workflows' pinned toolchain (lock file in the action,
      # Dependabot bumps it there) instead of a registry install per run or a package.json here.
      # Ruleset bypass for the release commit (2026-09-11 audit, finding 2): main is protected by
      # a ruleset (pull request + green test stage) that the GitHub Actions app cannot be a
      # bypass actor for on a personal repository, so @semantic-release/git pushes over SSH as a
      # write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset - the push
      # then goes through the GITHUB_TOKEN https remote exactly as before. Both release jobs need
      # this: @semantic-release/git's verifyConditions runs `git push --dry-run` even in
      # get-version's dry-run mode. Setup: see enable-main-protection.sh next to the repo.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@a5f01cccfa7a63023b5a2f67993f771d856c0ee4 # v1.7.1
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@a5f01cccfa7a63023b5a2f67993f771d856c0ee4 # v1.7.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between
      # this job's checkout and its own push (the concurrency group above already serializes
      # overlapping runs of this workflow, so this only guards against a genuinely external push).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: lukislp/ci-workflows/.github/actions/semantic-release@a5f01cccfa7a63023b5a2f67993f771d856c0ee4 # v1.7.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Signed release asset (OpenSSF Scorecard "Signed-Releases"): the same keyless Sigstore
      # signing the container images get, applied to server.zip, plus GitHub build provenance.
      # Both bundles are uploaded next to the asset so a download can be verified offline:
      #   cosign verify-blob --bundle server.zip.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/lukislp/studylife/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com server.zip
      # Only reached when semantic-release succeeded (a failed retry fails the job above).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign server.zip and attach the signature bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.get-version.outputs.next_version }}
        run: |
          # Guard against a version drift between get-version's dry run and the real release.
          gh release view "$TAG" --json tagName --jq .tagName
          cosign sign-blob --yes --bundle publish/server.zip.sigstore.json publish/server.zip
          cosign verify-blob --bundle publish/server.zip.sigstore.json \
            --certificate-identity-regexp '^https://github.com/lukislp/studylife/\.github/workflows/ci-cd\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            publish/server.zip
          gh release upload "$TAG" publish/server.zip.sigstore.json --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: publish/server.zip
      - name: Attach the build provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.get-version.outputs.next_version }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" publish/server.zip.intoto.jsonl
          gh release upload "$TAG" publish/server.zip.intoto.jsonl --clobber
