# Load balancer for docker-compose.scale.yml (learning/test setup, NOT the Pi production deployment).
#
# Docker Compose gives all replicas of a service (--scale server=N) the same name "server"
# in its built-in DNS (127.0.0.11) and returns all N IPs on every resolution (round-robin
# at the DNS level). By default, though, nginx resolves a hostname in proxy_pass only ONCE when
# loading the config and then caches exactly ONE IP - with --scale server=5, 4 of 5 replicas
# would never see a request. The trick: "resolver" plus a variable in proxy_pass forces nginx to
# re-resolve the name via Docker's DNS on EVERY request, so requests actually get
# distributed across all currently running replicas (and newly started replicas are picked up
# immediately, without an nginx restart).
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location / {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        # $host strips the port (an nginx quirk) - StudyLife derives the RP ID/origin for WebAuthn
        # from the Host header (AuthController.CreateFido2()); with $host alone, the backend would
        # see "localhost" instead of "localhost:8090", and passkey attestation would fail with
        # "origin not equal" because client and server would assume different origins.
        # $http_host passes the Host header through unchanged, including the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
