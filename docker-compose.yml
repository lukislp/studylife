services:

  server:
    image: registry.example.com/studylife/server:latest
    container_name: studylife-server
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Pins the WebAuthn RP-id/origin instead of deriving it from the incoming request's
      # Host/Scheme headers (defense-in-depth; the K3s path in k8s/01-config-and-secret.yaml
      # is the one actually in production).
      Fido2__ServerDomain: studylife.example.com
      Fido2__Origins__0: https://studylife.example.com
    volumes:
      - studylife-data:/app/app_data
    networks:
      - studylife-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: studylife-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      DOCKER_CONFIG: /
      DOCKER_API_VERSION: "1.41"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - studylife-net

volumes:
  studylife-data:
    driver: local

networks:
  studylife-net:
    driver: bridge
