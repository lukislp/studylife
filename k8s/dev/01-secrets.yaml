# Learning-cluster-only credentials (Secret), moved here from k8s/01-config-and-secret.yaml.
#
# IMPORTANT: The Postgres password here is a simple test password, publicly visible in this
# repo - intended exclusively for the local Docker Desktop learning cluster, NEVER use it like
# this in a real cluster. This is why this file lives in its own k8s/dev/ subfolder instead of
# directly under k8s/: "kubectl apply -f k8s/" (the prod bulk-apply command) is NOT recursive, so
# it never touches this folder - the SAME name/namespace used to live directly under k8s/ and
# collided with the prod SealedSecret-managed secret of the same name (see docs/SCALING.md for
# the near-incident that caused). Applying this file is now always an explicit, separate step -
# see README.md in this folder. For real deployments the secret should be created via
# `kubectl create secret` / a secret manager (Sealed Secrets, External Secrets Operator, cloud
# KMS), not as plaintext YAML in the Git repo - see k8s/sealed-secrets/studylife-scale/ and
# docs/SCALING.md.
apiVersion: v1
kind: Secret
metadata:
  name: studylife-secrets
  namespace: studylife-scale
type: Opaque
stringData:
  POSTGRES_PASSWORD: "studylife-k8s-dev"
  # Host = studylife-pg-pooler (CNPG pooler/PgBouncer, see k8s/11-pooler.yaml) instead of directly
  # studylife-pg-rw - avoids every web/worker pod opening its own Npgsql pool against
  # Postgres' max_connections. "Max Auto Prepare=0" is MANDATORY in transaction pooling
  # mode: PgBouncer doesn't hold a fixed server connection per client there, server-side cached
  # prepared statements (Npgsql's default behavior) would lead to "prepared statement already
  # exists" errors as soon as PgBouncer reassigns the same client to a different server connection
  # - empirically verified with ApiVerify, see docs/SCALING.md. Rollback if problems arise:
  # switch the host back to studylife-pg-rw, "Max Auto Prepare=0" can stay (doesn't hurt there).
  Database__ConnectionString: "Host=studylife-pg-pooler;Port=5432;Database=studylife;Username=studylife;Password=studylife-k8s-dev;Max Auto Prepare=0"
---
# CNPG expects a secret with exactly these two keys (username/
# password) for bootstrap.initdb.secret, not the POSTGRES_PASSWORD format above - a separate secret
# instead of reuse, because CNPG rigidly mandates this format.
apiVersion: v1
kind: Secret
metadata:
  name: studylife-pg-app-secret
  namespace: studylife-scale
type: Opaque
stringData:
  username: "studylife"
  password: "studylife-k8s-dev"
