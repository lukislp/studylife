# Fourth GitRepository source (in addition to 01-git-source.yaml watching this repo,
# 06-studylife-ai-git-source.yaml watching studylife-ai, and 11-studylife-mcp-git-source.yaml
# watching studylife-mcp) - piwatch is a separate repo/service (the K8s cluster live-monitoring
# dashboard, FastAPI + React), onboarded onto the same Flux install rather than standing up a
# second one, same reasoning as the other two. Needs write access (not just read) -
# image-automation-controller pushes commits for new image tags directly to master. Reuses the
# existing "studylife-git-auth" secret, same trade-off already accepted for studylife-ai/-mcp (a
# classic GitHub PAT with public_repo scope, not scoped to a single repo anyway).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: piwatch
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/piwatch.git
  ref:
    branch: master
  secretRef:
    name: studylife-git-auth
