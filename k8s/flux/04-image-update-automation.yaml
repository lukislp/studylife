# Automatically commits new image tags to master (directly, no MR - a deliberate decision:
# matches the previous Watchtower behavior, no manual click per release). Patches ONLY
# the two marker comments in k8s/04-web.yaml/05-worker.yaml (# {"$imagepolicy": ...}) -
# NOT the rest of the k8s/ folder, which continues to contain placeholders and is only
# resolved via bootstrap-cluster.ps1 (see docs/SCALING.md, scoping decision).
#
# "[skip ci]" in the commit template is MANDATORY, not a style choice - found in production: without
# it, every plain image-tag commit (no app code changed) still triggered the entire GitLab pipeline
# again (build+tests+Docker rebuild+push of the same, already published image) - pure
# waste, since .gitlab-ci.yml has no path filters. semantic-release's own
# "chore(release): ... [skip ci]" commits already got this right, this template only caught up
# afterwards. Affects ONLY the GitLab CI trigger, not Flux's own reconciliation (which
# watches the Git ref directly, independent of GitLab CI).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: studylife-server
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: studylife
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@studylife.local
        name: fluxcdbot
      messageTemplate: |
        chore(image): auto-update [skip ci]
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
            {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{ end -}}
  update:
    path: ./k8s
    strategy: Setters
