# Same pattern as 09-studylife-ai-image-update-automation.yaml / 14-studylife-mcp-image-update-
# automation.yaml, but sourceRef/checkout/push all target the piwatch GitRepository
# (16-piwatch-git-source.yaml) - the commit lands in piwatch's own repo, where its
# deploy/deployment.yaml AND deploy/daemonset-node-agent.yaml marker comments
# (# {"$imagepolicy": "flux-system:piwatch"}) live, not this one. update.path is "./deploy"
# (not "./k8s" like the other two) - piwatch's manifests live under deploy/, not k8s/.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: piwatch
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: piwatch
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@studylife.local
        name: fluxcdbot
      messageTemplate: |
        chore(image): auto-update [skip ci]
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
            {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{ end -}}
  update:
    path: ./deploy
    strategy: Setters
