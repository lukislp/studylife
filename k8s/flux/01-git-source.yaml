# Points Flux at the StudyLife repo itself (public GitHub repo, see git remote -v). Needs
# write access (not just read), since image-automation-controller pushes commits for new image tags
# directly to main (see 04-image-update-automation.yaml). The secret "studylife-git-auth"
# is NOT created here (no plaintext token in the repo) - created via kubectl, see docs/SCALING.md
# (a GitHub PAT with "public_repo" scope, since reads themselves need no auth on a public repo).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: studylife
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/studylife.git
  ref:
    branch: main
  secretRef:
    name: studylife-git-auth
