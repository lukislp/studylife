# OPTIONAL and applied by hand (kubectl apply -f k8s/flux/06-kustomization-mdns.yaml, once): it
# is NOT part of k8s/flux/deploy and nothing in the cluster applies it for you. Where
# 05-kustomization.yaml keeps web and worker on the latest image tag, this one keeps the mDNS
# announcer (k8s/optional/studylife-mdns.yaml, docs/MDNS.md) on it - without it the announcer
# stays on whatever image it was last applied with, because Flux deliberately reconciles only
# k8s/flux/deploy.
#
# It owns the announcer's Deployment (prune: true), so removing this Kustomization removes the
# announcer again. It does NOT manage the studylife-mdns namespace: kustomize-controller's
# least-privilege role has no namespaces permission, so create the namespace once by hand first
# (kubectl apply -f k8s/optional/studylife-mdns.yaml does that, with the Pod Security "privileged"
# label the pod's hostNetwork needs - see the manifest header and docs/MDNS.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studylife-mdns
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: studylife
  path: ./k8s/flux/mdns
  prune: true
  wait: true
  timeout: 3m
