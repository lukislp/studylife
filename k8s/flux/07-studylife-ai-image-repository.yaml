# Scans GHCR for new tags of the studylife-ai image (.github/workflows/ci.yml "docker" job in
# the studylife-ai repo). Public package - no secretRef needed, same as 02-image-repository.yaml.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: studylife-ai
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/studylife-ai
  interval: 5m
