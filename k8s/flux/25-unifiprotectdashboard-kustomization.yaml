# Applies EXCLUSIVELY UnifiProtectDashboard's k8s/flux-deploy/ (its curated Flux-managed subset -
# PersistentVolumeClaim/Deployment/Service only, NOT its Namespace/HTTPRoute/NetworkPolicy files,
# which are bootstrap-only - see UnifiProtectDashboard's k8s/flux-deploy/kustomization.yaml
# header for the RBAC reasoning, identical to 15-studylife-mcp-kustomization.yaml's). No RBAC
# changes needed on this side (06-reconciler-rbac.yaml) - the resource kinds
# UnifiProtectDashboard's Flux-managed subset uses (PVC/Service/Deployment) are already covered
# by the existing ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifiprotectdashboard-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: unifiprotectdashboard
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
