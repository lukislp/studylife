# Deliberately ONLY these two files (not the rest of k8s/, which contains placeholders, see
# docs/SCALING.md "GitLab integration"). Closes the last gap in image automation: Flux
# does commit the new image tag directly into k8s/04-web.yaml/05-worker.yaml, but without this
# Kustomization that would never actually be applied to the cluster.
#
# Prometheus + the 3 Grafana dashboard/alerting files that used to be listed here moved to
# homelab-infra/flux/infra-deploy/kustomization.yaml as part of the cluster-wide-infra split -
# that Kustomization reached Ready and adopted the same live objects (server-side apply, same
# field manager semantics) before this list was trimmed, so there was no window without anything
# reconciling them.
#
# Audit finding O4: the imagePullPolicy patch that used to live here is GONE - it existed only
# because the git-versioned files permanently had "Never" set (only bootstrap-cluster.ps1 wrote
# "Always" in memory before applying, never back into Git), so a direct "kubectl apply -f
# k8s/04-web.yaml" during an incident would silently break the prod pull. k8s/04-web.yaml/
# 05-worker.yaml now commit "imagePullPolicy: Always" directly, so this Kustomization has nothing
# left to patch - a plain resource list is now enough to keep this path's output identical to a
# direct apply of those two files (see test-k8s-manifests in .github/workflows/ci-cd.yml, which
# validates this exact `kubectl kustomize` output).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../04-web.yaml
  - ../../05-worker.yaml
