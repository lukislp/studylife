# Scans GHCR for new tags of the piwatch image (.github/workflows/ci-cd.yml "docker-build-push"
# job in the piwatch repo). Public package - no secretRef needed, same as
# 07-studylife-ai-image-repository.yaml / 12-studylife-mcp-image-repository.yaml.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: piwatch
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/piwatch
  interval: 5m
