# Second GitRepository source (in addition to k8s/flux/01-git-source.yaml, which watches this
# repo) - studylife-ai is a separate repo/service, onboarded onto the same Flux install rather
# than standing up a second one, see studylife-ai's docs/decisions.md "M5 - Deployment design".
# Needs write access (not just read), same reasoning as 01-git-source.yaml: image-automation-
# controller pushes commits for new image tags directly to main. Reuses the existing
# "studylife-git-auth" secret rather than a new one [owner: user] - it's a classic GitHub PAT
# (public_repo scope), which GitHub never scopes to a single repo anyway, so it already covers
# lukislp/studylife-ai too. Trade-off accepted: both GitRepository sources now share one
# credential, so rotating/revoking it affects both at once - acceptable for a personal homelab
# setup, not something a stricter multi-tenant setup should copy without reconsidering.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: studylife-ai
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/studylife-ai.git
  ref:
    branch: main
  secretRef:
    name: studylife-git-auth
