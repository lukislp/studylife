# Applies EXCLUSIVELY piwatch's deploy/flux-deploy/ (its curated Flux-managed subset -
# ConfigMap/Deployment/DaemonSet/Service/PDB only, NOT its Namespace/RBAC/HTTPRoute/
# SealedSecret files, which are bootstrap-only - see piwatch's deploy/flux-deploy/
# kustomization.yaml header for the RBAC reasoning, identical to
# 15-studylife-mcp-kustomization.yaml's). Unlike studylife-mcp, this DOES need an RBAC change
# on this side (06-reconciler-rbac.yaml) - piwatch's DaemonSet is part of the managed subset,
# and "daemonsets" wasn't previously granted to kustomize-controller's ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piwatch-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: piwatch
  path: ./deploy/flux-deploy
  prune: true
  wait: true
  timeout: 3m
