# Scans GHCR for new tags of the StudyLife server image (the same image for web + worker,
# see .github/workflows/ci-cd.yml "docker-server" job). Public package - no secretRef needed,
# Flux can query the registry API anonymously (see docs/SCALING.md for the GitLab-era node-side
# pull auth this replaced).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: studylife-server
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/studylife-server
  interval: 5m
