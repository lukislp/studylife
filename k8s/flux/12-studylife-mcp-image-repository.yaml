# Scans GHCR for new tags of the studylife-mcp image (.github/workflows/ci.yml "docker" job in
# the studylife-mcp repo). Public package - no secretRef needed, same as
# 07-studylife-ai-image-repository.yaml.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: studylife-mcp
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/studylife-mcp
  interval: 5m
