# Same SemVer policy as 03-image-policy.yaml - studylife-ai's own .releaserc.json also pushes
# plain SemVer tags without a "v" prefix via semantic-release.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: studylife-ai
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: studylife-ai
  policy:
    semver:
      range: ">=0.0.0"
