# Applies EXCLUSIVELY studylife-ai's k8s/flux-deploy/ (its curated Flux-managed subset -
# ConfigMap/Qdrant/app Deployment+PVC+Service only, NOT its Namespace/Secret/NetworkPolicy
# files, which are bootstrap-only - see studylife-ai's k8s/flux-deploy/kustomization.yaml
# header for the RBAC reasoning, identical to why 05-kustomization.yaml here only applies
# k8s/flux/deploy/, not the whole k8s/ folder). No RBAC changes needed on this side
# (06-reconciler-rbac.yaml) - the resource kinds studylife-ai's Flux-managed subset uses
# (ConfigMap/PVC/Service/Deployment) are already covered by the existing ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studylife-ai-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: studylife-ai
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
