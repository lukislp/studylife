# Same SemVer policy as 08-studylife-ai-image-policy.yaml / 13-studylife-mcp-image-policy.yaml /
# 18-piwatch-image-policy.yaml - UnifiProtectDashboard's own semantic-release setup also pushes
# plain SemVer docker tags without a "v" prefix.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: unifiprotectdashboard
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: unifiprotectdashboard
  policy:
    semver:
      range: ">=0.0.0"
