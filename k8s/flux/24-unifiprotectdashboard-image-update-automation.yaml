# Same pattern as 09-studylife-ai-image-update-automation.yaml / 14-studylife-mcp-image-update-
# automation.yaml / 19-piwatch-image-update-automation.yaml, but sourceRef/checkout/push all
# target the unifiprotectdashboard GitRepository (21-unifiprotectdashboard-git-source.yaml) - the
# commit lands in UnifiProtectDashboard's own repo, where its k8s/01-app.yaml marker comment
# (# {"$imagepolicy": "flux-system:unifiprotectdashboard"}) lives. update.path is "./k8s" -
# UnifiProtectDashboard's manifests live under k8s/, same as studylife-ai/studylife-mcp.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: unifiprotectdashboard
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: unifiprotectdashboard
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@studylife.local
        name: fluxcdbot
      messageTemplate: |
        chore(image): auto-update [skip ci]
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
            {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{ end -}}
  update:
    path: ./k8s
    strategy: Setters
