# Selects the "newest" tag by SemVer from the tags scanned by ImageRepository. semantic-
# release pushes plain SemVer tags without a "v" prefix (e.g. "1.5.8", see
# .github/workflows/ci-cd.yml NEXT_VERSION) - Flux's standard SemVer policy parses exactly this
# format. Other existing tags ("latest", "buildcache" from the Buildx cache) are not valid SemVer
# and are automatically ignored, no extra filterTags needed.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: studylife-server
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: studylife-server
  policy:
    semver:
      # Bounded to the current major (2026-09 audit I1): a mis-tagged or premature major would
      # otherwise roll out unattended within five minutes. Bump this range deliberately as part
      # of a major release, never let the automation discover one.
      range: ">=3.0.0 <4.0.0"
