# Applies EXCLUSIVELY studylife-mcp's k8s/flux-deploy/ (its curated Flux-managed subset -
# ConfigMap/CA-cert-ConfigMap/app Deployment+PVC+Service only, NOT its Namespace/Secret/
# NetworkPolicy/HTTPRoute files, which are bootstrap-only - see studylife-mcp's
# k8s/flux-deploy/kustomization.yaml header for the RBAC reasoning, identical to
# 10-studylife-ai-kustomization.yaml's). No RBAC changes needed on this side
# (06-reconciler-rbac.yaml) - the resource kinds studylife-mcp's Flux-managed subset uses
# (ConfigMap/PVC/Service/Deployment) are already covered by the existing ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studylife-mcp-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: studylife-mcp
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
