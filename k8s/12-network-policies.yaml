# By default, every pod in Kubernetes can reach every other pod in the same cluster - these
# policies restrict that to the actually necessary minimum for the studylife-scale namespace.
# The monitoring-namespace policies that used to live in this file moved to
# homelab-infra/cluster/05-network-policies-monitoring.yaml as part of the cluster-wide-infra
# split - same objects, same names, pure relocation, no cluster-side change.
# IMPORTANT LIMITATION: NetworkPolicy objects are accepted by EVERY CNI, but only enforced by
# some - whether Docker Desktop's Kubernetes CNI does so is documented empirically in
# docs/SCALING.md (positive + negative test). On a real multi-node cluster with Calico/Cilium,
# these same manifests actually take effect.
#
# Default-deny ingress as a baseline: no pod in the namespace may accept incoming traffic
# unless explicitly allowed below. Egress deliberately stays open (no default-deny egress) -
# otherwise EVERY external dependency (Cloudflare R2 for backups, possibly external APIs) would
# have to be allowlisted individually, which would be more complexity than benefit for this
# learning project.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: studylife-scale
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Critical, otherwise all name resolution breaks for ALL pods (easy to overlook with
# default-deny) - this is an egress policy, not a contradiction of "no default-deny egress"
# above: it only ALLOWS explicitly, forbids nothing additionally, since without egress policies
# on a pod everything stays allowed for egress anyway. Documented explicitly here nonetheless,
# because DNS is the one thing that must never be forgotten in a future tightening
# (default-deny egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: studylife-scale
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Egress otherwise unrestricted (no deny), this policy just adds an explicit DNS allowance -
    # becomes relevant if this is ever switched to default-deny egress later.
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-web
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { app: studylife-web } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Uptime Kuma (moved to the monitoring namespace, see homelab-infra/monitoring/
        # 10-uptime-kuma.yaml) also checks studylife-web DIRECTLY internally - found live:
        # without this allowance the "StudyLife Web (internal)" monitor hangs permanently in
        # PENDING/timeout, even though the same check works perfectly over the public URL. The
        # actual external reachability is handled via allow-nginx-gateway-to-web further below.
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: uptime-kuma } }
      ports:
        - { protocol: TCP, port: 8080 }
        # Additional HTTPS listener (Kestrel, see k8s/04-web.yaml/Program.cs) - 8080 stays open
        # for probes/Uptime Kuma.
        - { protocol: TCP, port: 8443 }
---
# studylife-ai calls StudyLife's own REST API server-to-server (ingestion, /agent tools) via
# cluster-internal Service DNS on port 8443 (HTTPS, trusting StudyLife's own internal
# cert-manager CA - see studylife-ai's own k8s/06-studylife-ca.yaml), not the public
# https://studylife.heim.lan hostname - StudyLife's UseHttpsRedirection forces HTTPS even for
# internal traffic, so port 8080 alone isn't reachable either (found live: a bare port-8080
# rule here produced ConnectTimeout on 8443, not a cert error - this rule was originally
# written before the redirect discovery and only allowed 8080). See studylife-ai's own
# k8s/01-config.yaml for the matching STUDYLIFE_API_BASE_URL value and docs/decisions.md
# "M5 - Deployment design" for the full story.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-ai-to-web
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { app: studylife-web } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-ai } }
          podSelector: { matchLabels: { app: studylife-ai } }
      ports:
        - { protocol: TCP, port: 8443 }
---
# Same reasoning and same port as allow-studylife-ai-to-web above - studylife-mcp (an MCP
# server exposing StudyLife to Claude/other MCP clients, separate repo/namespace) calls
# StudyLife's REST API server-to-server the identical way: cluster-internal Service DNS on
# port 8443, trusting the same internal cert-manager CA (see studylife-mcp's own
# k8s/03-studylife-ca.yaml and k8s/01-config.yaml's STUDYLIFE_BASE_URL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-mcp-to-web
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { app: studylife-web } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-mcp } }
          podSelector: { matchLabels: { app: studylife-mcp } }
      ports:
        - { protocol: TCP, port: 8443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { cnpg.io/cluster: studylife-pg } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: studylife-web } }
        - podSelector: { matchLabels: { app: studylife-worker } }
        - podSelector: { matchLabels: { cnpg.io/poolerName: studylife-pg-pooler } }
        # Uptime Kuma (monitoring namespace) needs this for a pure TCP reachability monitor (no
        # real DB login needed, just "is the port reachable?") - analogous to
        # allow-ingress-to-web above.
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: uptime-kuma } }
      ports:
        - { protocol: TCP, port: 5432 }
---
# Bug found live (real hardware 2-node setup, not the original test cluster): without this
# rule, a NEWLY joining replica (the CNPG "join" pod) cannot reach the primary via the *-rw
# service ("connection refused"), because neither allow-app-to-postgres nor any other rule
# allows pod-to-pod traffic BETWEEN the CNPG cluster members themselves (streaming replication).
# This was never noticed in the original test cluster, because the replication connections
# there already existed BEFORE the NetworkPolicies were applied, and existing TCP connections
# aren't cut off by a new NetworkPolicy - only a complete fresh bootstrap (NetworkPolicies
# active from the start) exposed the gap.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-replication
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { cnpg.io/cluster: studylife-pg } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { cnpg.io/cluster: studylife-pg } }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-pooler
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { cnpg.io/poolerName: studylife-pg-pooler } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: studylife-web } }
        - podSelector: { matchLabels: { app: studylife-worker } }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-and-self-to-redis
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { app: redis-cluster } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: studylife-web } }
        - podSelector: { matchLabels: { app: studylife-worker } }
        - podSelector: { matchLabels: { app: redis-cluster } } # cluster bus between the nodes
        # Uptime Kuma (monitoring namespace) needs this for a pure TCP reachability monitor (no
        # Redis login needed, just "is the port reachable?") - analogous to
        # allow-ingress-to-web above.
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: uptime-kuma } }
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 16379 }
        - { protocol: TCP, port: 6380 } # TLS client port (app<->Redis), see k8s/03-redis.yaml
---
# Prometheus (monitoring namespace, no default-deny there) must be able to reach the metrics
# ports of CNPG and the redis_exporter sidecar despite the default-deny here - otherwise
# Prometheus shows these targets as DOWN even though the exporter itself works. Two separate
# policy objects instead of one shared podSelector, because multiple matchExpressions in ONE
# podSelector are AND-combined (no OR) - a pod would otherwise incorrectly have to satisfy BOTH
# label conditions simultaneously.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-cnpg
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { cnpg.io/cluster: studylife-pg } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports:
        - { protocol: TCP, port: 9187 }
---
# Bug found live: the default-deny ingress above also blocked the CNPG OPERATOR itself (runs
# in the separate cnpg-system namespace, not studylife-scale) - it needs access to the instance
# manager status port 8000 of every Postgres instance to determine cluster state. Without this
# rule, "kubectl get cluster" incorrectly showed "Instance Status Extraction Error", even though
# Postgres itself was running fine - the operator just could no longer check on it. Found live
# via the operator logs ("dial tcp ...:8000: i/o timeout").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator-to-instances
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { cnpg.io/cluster: studylife-pg } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } }
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-redis-exporter
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { app: redis-cluster } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports:
        - { protocol: TCP, port: 9121 }
---
# NGINX Gateway Fabric (see k8s/06c-nginx-gateway-fabric.md) - ingress-nginx has since been
# decommissioned (see docs/SCALING.md "Migration to NGINX Gateway Fabric completed"), that was
# the last remaining reference to it in this file. The source is the nginx-gateway namespace,
# where NGF provisions the NGINX data plane per gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-gateway-to-web
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { app: studylife-web } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-gateway-to-download
  namespace: studylife-scale
spec:
  podSelector: { matchLabels: { app: studylife-download } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
      ports:
        - { protocol: TCP, port: 8443 }
