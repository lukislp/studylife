# Non-secret configuration (ConfigMap), shared by both deployment flows (prod via SealedSecrets
# and the learning cluster via bootstrap-cluster.ps1) - safe to live in the default
# "kubectl apply -f k8s/" set since it never carries credentials.
#
# The credentials (Secret) that used to live in this same file were moved to k8s/dev/ - they had
# the SAME name/namespace as the prod SealedSecret-managed secrets (k8s/sealed-secrets/), so a
# bulk "kubectl apply -f k8s/" against prod could silently overwrite the real credentials with
# the public test password. "kubectl apply -f k8s/" is NOT recursive, so k8s/dev/ is never picked
# up that way - see k8s/dev/README.md for the learning-cluster secrets and docs/SCALING.md for
# background (including a near-incident this exact collision caused).
apiVersion: v1
kind: ConfigMap
metadata:
  name: studylife-config
  namespace: studylife-scale
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Database__Provider: "Postgres"
  Cache__Provider: "Redis"
  # All 6 cluster nodes listed (StackExchange.Redis queries CLUSTER SLOTS on connect and
  # determines the slot topology itself - the list here only serves the initial connection/discovery,
  # no code difference from a single instance). Stable DNS names come from the headless service in
  # k8s/03-redis.yaml (StatefulSet ordinals).
  # Port 6380 = TLS client port (k8s/03-redis.yaml), ssl=true enables TLS in StackExchange.Redis.
  # The cluster bus (Redis<->Redis) deliberately stays plaintext, see comment in k8s/03-redis.yaml.
  Cache__ConnectionString: "redis-cluster-0.redis-cluster:6380,redis-cluster-1.redis-cluster:6380,redis-cluster-2.redis-cluster:6380,redis-cluster-3.redis-cluster:6380,redis-cluster-4.redis-cluster:6380,redis-cluster-5.redis-cluster:6380,ssl=true"
  # Pins the WebAuthn RP-id/origin instead of relying on the incoming request's Host/Scheme
  # headers (only matters if the app is ever reached directly, bypassing the Gateway/nginx -
  # the Gateway already forwards the correct Host in normal operation, so this is a no-op
  # for legitimate traffic).
  Fido2__ServerDomain: "studylife.example.com"
  Fido2__Origins__0: "https://studylife.example.com"
