# Non-secret configuration (ConfigMap) and credentials (Secret) for the learning setup.
#
# IMPORTANT: The Postgres password here is a simple test password, publicly visible in this
# repo - intended exclusively for the local Docker Desktop learning cluster, NEVER use it like
# this in a real cluster. For real deployments the secret should be created via `kubectl create
# secret` / a secret manager (Sealed Secrets, External Secrets Operator, cloud KMS),
# not as plaintext YAML in the Git repo - see docs/SCALING.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: studylife-config
  namespace: studylife-scale
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Database__Provider: "Postgres"
  Cache__Provider: "Redis"
  # All 6 cluster nodes listed (StackExchange.Redis queries CLUSTER SLOTS on connect and
  # determines the slot topology itself - the list here only serves the initial connection/discovery,
  # no code difference from a single instance). Stable DNS names come from the headless service in
  # k8s/03-redis.yaml (StatefulSet ordinals).
  # Port 6380 = TLS client port (k8s/03-redis.yaml), ssl=true enables TLS in StackExchange.Redis.
  # The cluster bus (Redis<->Redis) deliberately stays plaintext, see comment in k8s/03-redis.yaml.
  Cache__ConnectionString: "redis-cluster-0.redis-cluster:6380,redis-cluster-1.redis-cluster:6380,redis-cluster-2.redis-cluster:6380,redis-cluster-3.redis-cluster:6380,redis-cluster-4.redis-cluster:6380,redis-cluster-5.redis-cluster:6380,ssl=true"
  # Pins the WebAuthn RP-id/origin instead of relying on the incoming request's Host/Scheme
  # headers (only matters if the app is ever reached directly, bypassing the Gateway/nginx -
  # the Gateway already forwards the correct Host in normal operation, so this is a no-op
  # for legitimate traffic).
  Fido2__ServerDomain: "studylife.example.com"
  Fido2__Origins__0: "https://studylife.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: studylife-secrets
  namespace: studylife-scale
type: Opaque
stringData:
  POSTGRES_PASSWORD: "studylife-k8s-dev"
  # Host = studylife-pg-pooler (CNPG pooler/PgBouncer, see k8s/11-pooler.yaml) instead of directly
  # studylife-pg-rw - avoids every web/worker pod opening its own Npgsql pool against
  # Postgres' max_connections. "Max Auto Prepare=0" is MANDATORY in transaction pooling
  # mode: PgBouncer doesn't hold a fixed server connection per client there, server-side cached
  # prepared statements (Npgsql's default behavior) would lead to "prepared statement already
  # exists" errors as soon as PgBouncer reassigns the same client to a different server connection
  # - empirically verified with ApiVerify, see docs/SCALING.md. Rollback if problems arise:
  # switch the host back to studylife-pg-rw, "Max Auto Prepare=0" can stay (doesn't hurt there).
  Database__ConnectionString: "Host=studylife-pg-pooler;Port=5432;Database=studylife;Username=studylife;Password=studylife-k8s-dev;Max Auto Prepare=0"
---
# CNPG expects a secret with exactly these two keys (username/
# password) for bootstrap.initdb.secret, not the POSTGRES_PASSWORD format above - a separate secret
# instead of reuse, because CNPG rigidly mandates this format.
apiVersion: v1
kind: Secret
metadata:
  name: studylife-pg-app-secret
  namespace: studylife-scale
type: Opaque
stringData:
  username: "studylife"
  password: "studylife-k8s-dev"
