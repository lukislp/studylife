# A real HA cluster via the CloudNativePG operator (1 primary + 2 replicas, streaming
# replication, automatic failover) instead of a single pod - this is the standard approach for
# Postgres HA in Kubernetes, comparable to what RDS Multi-AZ does internally. For this data
# volume, deliberately NO sharding (Citus/CockroachDB would be overkill here) - see
# docs/SCALING.md. Operator installation is a one-time, cluster-wide step outside this
# namespace (see docs/SCALING.md for the exact command), only the Cluster resource itself lives
# here. For a real cloud cluster, a managed database belongs here (AWS RDS, Cloud SQL, Azure
# Database for PostgreSQL) instead of a self-managed instance INSIDE the cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: studylife-pg
  namespace: studylife-scale
spec:
  # 3 instances (1 primary + 2 standby) - analyzed on real hardware: the nodes are asymmetric
  # (pinode01 4GB, pinode02 8GB, see docs/SCALING.md), together ~12GB instead of the originally
  # assumed 8GB, considerably more buffer than the initial lean profile assumed. Full 3-way HA
  # re-enabled.
  instances: 3
  # Pinned explicitly. Until 2026-09-13 this field was absent, so the cluster ran on whatever
  # image the operator defaulted to WHEN IT WAS CREATED (16.4) - a value frozen into the live
  # spec by CNPG's defaulting webhook and invisible in git, which meant the running Postgres
  # minor was neither reviewable nor reproducible from this repo. 16.4 is from August 2024;
  # 16.15 is the current 16.x and carries ~14 months of accumulated fixes, including several
  # security ones. Staying on major 16 deliberately: a major upgrade is an offline
  # pg_upgrade/logical-replication operation, a different exercise entirely.
  #
  # CNPG handles a minor-version image change as a rolling update - replicas first, the
  # primary last. primaryUpdateMethod "switchover" instead of the default "restart": with 3
  # instances there is always an already-upgraded replica to promote, so the write endpoint
  # moves to a healthy node in seconds instead of the primary going down for the length of an
  # image pull plus a Postgres start. "unsupervised" keeps the operator doing this on its own
  # (the default) - "supervised" would stop and wait for a manual promotion.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead
    # of local-path - migrated 2026-08-25 one replica at a time (delete a non-primary
    # instance's PVC+pod, CNPG detects the missing volume for that ordinal and re-clones it
    # from the primary using this spec, i.e. onto the new storage class; the cluster stays at
    # full instance count throughout since only one instance is ever missing at once), then a
    # "kubectl cnpg promote" switched the primary onto an already-migrated instance before the
    # old primary's own PVC got the same treatment. Existing PVCs are immutable in-place and
    # scaling instances down/up always drops the highest-ordinal (i.e. newest) instance first,
    # which would just undo a freshly migrated one - the per-ordinal PVC replacement is CNPG's
    # actual supported path for a live storage-class change on a multi-instance cluster.
    storageClass: longhorn
    # 4Gi (raised from 1Gi 2026-09-13). The database itself is ~9.5MB - the volume was at 64%
    # (609MiB of 974MiB) anyway, because pg_wal shares it and a 1Gi volume leaves almost no
    # headroom for a WAL burst: if pg_wal fills the volume, Postgres shuts down and CNPG
    # cannot fail over out of it (every instance has the same size). Longhorn's storage class
    # has allowVolumeExpansion, and Longhorn >= 1.4 (running 1.7.2) expands attached volumes
    # online, so CNPG resizes the PVCs in place - no failover, no re-clone. Shrinking is NOT
    # possible afterwards; 4Gi is deliberately modest for the same reason.
    size: 4Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  postgresql:
    parameters:
      # Standard rule of thumb ~25% of the instance limit - the untuned default is calibrated
      # for a "normal" server, not for a Pi's resource budget.
      shared_buffers: "128MB"
  # CNPG enables pod anti-affinity between its own instances by default itself
  # (enablePodAntiAffinity: true, podAntiAffinityType: preferred) - set explicitly here anyway
  # instead of relying on the default, for documentation purposes and as protection against
  # future CNPG version changes. "preferred" instead of "required": works identically on a
  # single-node test cluster (co-location instead of Pending forever) and on a real multi-node
  # cluster (real spreading) - see the k8s/04-web.yaml comment for the same logic.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  # Metrics endpoint (port 9187) TLS-encrypted - CNPG generates the server certificate itself
  # (the same internal CA mechanism as for Postgres client connections), no manual
  # certificate/cert-manager object needed. Prometheus scrape config switched accordingly to
  # scheme: https + insecure_skip_verify (k8s/14-prometheus.yaml). According to the CNPG docs,
  # changing this option triggers a rollout of all instances.
  monitoring:
    tls:
      enabled: true
  bootstrap:
    initdb:
      database: studylife
      owner: studylife
      secret:
        name: studylife-pg-app-secret
  # CNPG automatically creates "studylife-pg-rw" (always the current primary, even after a
  # failover), "studylife-pg-ro" (replicas, currently unused - the app deliberately doesn't
  # route by read/write, see docs/SCALING.md), and "studylife-pg-r" (any instance) from this.
  #
  # Continuous WAL archiving + daily base backups to Cloudflare R2 (S3-compatible) - in
  # addition to the replica redundancy above, this also protects against data
  # corruption/accidental DELETE (replicas only protect against node failure, not against a
  # faulty write that gets replicated to all replicas immediately).
  #
  # Since 2026-09-29 this runs through the CNPG Barman Cloud Plugin instead of the in-tree
  # spec.backup.barmanObjectStore block (deprecated, removed in CNPG 1.30). WHERE the archive
  # goes (bucket, credentials, compression) and HOW LONG it is kept (retentionPolicy "30d") now
  # live on the ObjectStore in k8s/02b-objectstore.yaml - the plugin keeps retention on the
  # ObjectStore, not on the Cluster. The reasoning behind 30d, for the record: it was briefly
  # 3d on the assumption that R2 storage/cost scales with the window - measured, it does not
  # matter here, the database is ~9.5MB, so a month of daily gzip-compressed base backups plus
  # their WAL segments stays far inside R2's free tier. 3d was the real risk instead - a
  # corruption or bad migration noticed on a Monday could not be rewound past Friday, and
  # point-in-time recovery is the entire reason this archive exists.
  #
  # The switch from the in-tree block to this plugins entry was ONE atomic edit - a Cluster
  # with neither is a Cluster that is not archiving. serverName is pinned explicitly: it
  # defaults to the Cluster name on both paths, but if it ever drifts barman silently starts a
  # NEW tree in the bucket and the 30d recovery window restarts at zero while archiving keeps
  # reporting healthy. Must stay "studylife-pg". Verified on migration: firstRecoverabilityPoint
  # unchanged, i.e. the plugin continued the tree the in-tree path had written.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-studylife
        serverName: studylife-pg
