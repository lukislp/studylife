# HTTPRoutes for the NGF gateway (k8s/07c-gateway.yaml) - the Gateway API equivalent of the
# previous ingress objects (k8s/07-ingress.yaml, k8s/09-uptime-kuma.yaml, k8s/17-grafana.yaml;
# piwatch lives in the piwatch repo). Unlike there, the REAL hostnames live in Git here:
# HTTPRoute is a new resource type with no bootstrap-cluster.ps1 placeholder substitution, and
# the piwatch repo already commits its hostnames the same way.
#
# BackendTLSPolicy replaces the backend-protocol=HTTPS annotation for the encrypted
# gateway -> pod hop. Unlike ingress-nginx (proxy-ssl-verify off), the Gateway API mandatorily
# VERIFIES the backend hop - CA reference to the ca.crt in the respective *-backend-tls secret
# (supplied by cert-manager when issuing), hostname = service DNS name (SAN of the backend
# certificate, see the Certificate objects in k8s/04-web.yaml/09/17).
#
# The grafana AND uptime-kuma HTTPRoute/BackendTLSPolicy/RateLimitPolicy that used to live in
# this file moved to homelab-infra/cluster/03-httproutes-shared.yaml as part of the
# cluster-wide-infra split (uptime-kuma also moved namespace, studylife-scale -> monitoring, see
# homelab-infra/monitoring/10-uptime-kuma.yaml - it monitors the whole cluster, not just
# studylife). Referencing the shared Gateway (k8s/07c-gateway.yaml) from a different repo/path
# than the HTTPRoute itself is normal, intended Gateway API usage.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: studylife-web
  namespace: studylife-scale
spec:
  parentRefs:
    - name: studylife-gateway
      namespace: nginx-gateway
  hostnames:
    - studylife.heim.lan
    - studylife.lukas2311-homelab.com
  rules:
    # Audit finding O8: during a rolling update, a request for a NEW fingerprinted asset can
    # land on an OLD pod that doesn't have the file -> 404 -> SRI failure for open SPA
    # sessions until the rollout finishes. Gateway-side cache for the immutable fingerprinted
    # /_framework/* assets: once ANY new pod has served a file, the gateway answers from cache
    # regardless of which pod a later request would have hit. Recreate strategy was measured
    # and rejected (14-17s full outage per deploy); the SnippetsFilter below is scoped to
    # exactly this one route rule (ExtensionRef), so the shared gateway's other services see
    # zero config change.
    - matches:
        - path:
            type: PathPrefix
            value: /_framework
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: studylife-web-asset-cache
      backendRefs:
        - name: studylife-web
          port: 443
    - backendRefs:
        - name: studylife-web
          port: 443
---
# The cache config for the /_framework rule above (NGF v2.6.7 SnippetsFilter - route-scoped
# via ExtensionRef, deliberately NOT a Gateway-scoped SnippetsPolicy, which would inject into
# every service behind the shared gateway). Two safety properties:
# - The stable-NAMED, mutable loader files under /_framework (blazor.webassembly.js,
#   dotnet.js, blazor.boot.json) are excluded via the map below - caching those for days
#   would pin clients to an old boot manifest across releases. Everything else under
#   /_framework carries a content hash in its filename and is immutable by construction.
# - 200-only, 7d TTL (bounded staleness even if an unexpected mutable file slips through),
#   cookies ignored/stripped, X-Cache-Status exposed for the rollout observation
#   (expect MISS then HITs on a new asset while old pods still receive traffic).
# Rollback if the gateway rejects the snippet (watch: kubectl -n nginx-gateway logs
# deploy/studylife-gateway-nginx and this HTTPRoute's status conditions): revert this commit -
# while the filter is unresolved only /_framework requests are affected, never other routes.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: studylife-web-asset-cache
  namespace: studylife-scale
spec:
  snippets:
    - context: http
      value: |
        proxy_cache_path /var/cache/nginx/studylife_assets levels=1:2 keys_zone=studylife_assets:10m max_size=200m inactive=24h use_temp_path=off;
        map $uri $studylife_asset_nocache {
            default 0;
            ~/_framework/blazor\.webassembly\.js$ 1;
            ~/_framework/blazor\.boot\.json$ 1;
            ~/_framework/dotnet\.js$ 1;
        }
    - context: http.server.location
      value: |
        proxy_cache studylife_assets;
        proxy_cache_valid 200 7d;
        proxy_no_cache $studylife_asset_nocache;
        proxy_cache_bypass $studylife_asset_nocache;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_key $scheme$host$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: studylife-web-backend-tls
  namespace: studylife-scale
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: studylife-web
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: studylife-web-backend-tls
    hostname: studylife-web.studylife-scale.svc.cluster.local
---
# Identical rate limit to the previous ingress-nginx annotations (limit-rps=20,
# burst-multiplier=10, rejection with 503): noDelay corresponds to ingress-nginx's "nodelay" -
# without it, the parallel .dll/.wasm requests of the Blazor startup would be artificially
# throttled to 20 req/s instead of being served immediately.
apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: studylife-web-rate-limit
  namespace: studylife-scale
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: studylife-web
  rateLimit:
    local:
      rules:
        - zoneSize: 10m
          key: "$binary_remote_addr"
          rate: 20r/s
          burst: 200
          noDelay: true
    rejectCode: 503
---
# NGF's default backend-read timeout (~60s) is too short for the "read note aloud" feature
# (TtsController) on long notes - confirmed live: a ~2.4-minute audio synthesis on the Pi
# cluster's real ARM CPU exceeded it ("upstream timed out (110: Operation timed out) while
# reading response header from upstream" in the gateway's own logs; the pod was still working,
# not crashed - this was after the memory fix already landed). The standard Gateway API
# HTTPRoute `rules[].timeouts.backendRequest` field looked like the right tool, but NGF rejects
# it outright ("Forbidden: Timeouts... UnsupportedField" in the HTTPRoute's own status
# conditions, confirmed live) - it's an "Extended" conformance field the CRD schema allows but
# this controller doesn't implement. ProxySettingsPolicy's `timeout.read` is NGF's own vendor
# extension for the same nginx directive (proxy_read_timeout) and is what actually works.
# 150s covers the slow case with margin without leaving a route open indefinitely.
apiVersion: gateway.nginx.org/v1alpha1
kind: ProxySettingsPolicy
metadata:
  name: studylife-web-tts-timeout
  namespace: studylife-scale
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: studylife-web
  timeout:
    read: 150s
