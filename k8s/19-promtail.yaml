# Reads container logs per node (/var/log/pods hostPath) and ships them with Kubernetes metadata
# (namespace/pod/container labels) to Loki - DaemonSet, one pod per node, automatic.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # Real directory structure per node: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log -
          # "*$1" matches the pod directory via the unique UID as a suffix (the namespace/pod
          # name prefix before it doesn't matter thanks to the glob), the middle level is the
          # container name as its own subdirectory (not part of the file name).
          - source_labels: [__meta_kubernetes_pod_uid]
            target_label: __path__
            replacement: /var/log/pods/*$1/*/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels: { app: promtail }
  template:
    metadata:
      labels: { app: promtail }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.2.1
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: pods-logs, mountPath: /var/log/pods, readOnly: true }
            - { name: positions, mountPath: /run/promtail }
      volumes:
        - { name: config, configMap: { name: promtail-config } }
        - { name: pods-logs, hostPath: { path: /var/log/pods } }
        - { name: positions, hostPath: { path: /run/promtail, type: DirectoryOrCreate } }
