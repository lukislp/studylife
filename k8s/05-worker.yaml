# Real work partitioning across multiple replicas instead of just a redundant sweep: each replica
# now only sweeps its own user partition (AuthUserId % ReplicaCount == Shard). The shard is
# claimed dynamically at runtime via Redis (IWorkerShardClaim/RedisWorkerShardClaim in
# BackgroundTaskService.cs), NOT derived from the pod name - hence a plain Deployment instead of
# a StatefulSet, no stable ordinals needed. This makes the partitioning work identically on any
# platform (AWS ECS, multiple VPS, ...) as long as Redis is reachable - see docs/SCALING.md.
# Worker__ReplicaCountSource=Kubernetes lets the actual shard size be queried LIVE via the
# Kubernetes API (KubernetesWorkerReplicaCountProvider, RBAC in k8s/05b-worker-rbac.yaml) instead
# of relying on a static value frozen at pod startup - a prerequisite for the HPA in
# k8s/05c-worker-hpa.yaml, which automatically changes the replica count based on CPU load (see
# the IWorkerReplicaCountProvider.cs comment for the rationale). Worker__ReplicaCount remains as
# a FALLBACK value in case the Kubernetes API is ever unreachable. TryClaimReminderAsync (a
# unique index on SentReminders(AuthUserId, Key)) additionally remains as a safety net in case
# partition boundaries briefly overlap (e.g. during a rolling update or an HPA scaling event).
# No Service needed - the worker doesn't answer any incoming requests, only the healthcheck port
# is open (unused, but handy for a `kubectl port-forward` while debugging).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-worker
  namespace: studylife-scale
spec:
  # DELIBERATELY no "replicas:" field here - on every Flux reconcile (server-side apply) this
  # would reset whatever replica count the HPA (k8s/05c-worker-hpa.yaml) had just set and compete
  # with it for ownership of this field (SSA field-ownership conflict). Without this field,
  # Kubernetes automatically creates 1 replica on initial creation, then the HPA takes over fully.
  selector:
    matchLabels: {app: studylife-worker}
  template:
    metadata:
      labels: {app: studylife-worker}
    spec:
      serviceAccountName: studylife-worker
      # Soft (preferred), not hard - see the k8s/04-web.yaml comment: works identically on 1 node
      # (fallback: co-location instead of Pending) and on N nodes (real spreading).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app: studylife-worker}
                topologyKey: kubernetes.io/hostname
      # see the k8s/04-web.yaml comment: runAsUser MUST be numeric, otherwise CreateContainerConfigError.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife
          image: ghcr.io/lukislp/studylife-server:3.2.2 # {"$imagepolicy": "flux-system:studylife-server"}
          # Audit finding O4: committed directly as "Always" (see the matching comment on
          # k8s/04-web.yaml for the full rationale and the dev-cluster/"kind" override needed for
          # a locally-loaded image).
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef: {name: studylife-config}
            - secretRef: {name: studylife-secrets}
          env:
            - name: Worker__Enabled
              value: "true"
            # Audit finding O2: the worker never owns schema (Program.cs) - only the web
            # Deployment (k8s/04-web.yaml, which leaves Database:Migrate at its default "true")
            # calls Migrate() on startup. This pod instead polls until the web pod's migration
            # has landed (WaitForPendingMigrationsAsync in Program.cs) before proceeding, so two
            # concurrent Migrate() calls never race each other on a rolling restart. Deliberately
            # NOT set on docker-compose.scale.yml's worker service or the single-container
            # default - those flows are unaffected (both processes keep migrating there,
            # unchanged).
            - name: Database__Migrate
              value: "false"
            - name: Worker__ReplicaCountSource
              value: "Kubernetes"
            - name: Worker__ReplicaCount
              value: "1" # fallback only, in case the Kubernetes API is ever unreachable
            # Audit finding O6: this pod runs the same image as k8s/04-web.yaml but never serves
            # user traffic (no Service in front of it, see the class comment above) - it has no
            # legitimate way to reach TtsController/DictationController, and no BackgroundTaskService
            # job calls into either speech stack (confirmed: no BackgroundTaskService*.cs file
            # references Tts/Stt/Piper/Whisper). Speech:Enabled=false (Program.cs) skips registering
            # PiperVoiceRegistry/EspeakPhonemizer/WhisperTranscriber here entirely. Both already load
            # their actual ONNX/ggml model bytes LAZILY on first use rather than at startup (see
            # their class comments), so this is defense-in-depth against any future/accidental call
            # path rather than a fix for a measured eager-startup memory cost. Deliberately NOT set
            # on k8s/04-web.yaml, docker-compose.scale.yml's worker service, or the single-container
            # default - those flows keep serving "read note aloud"/dictation unchanged.
            - name: Speech__Enabled
              value: "false"
            # APNs channel (ApnsSender) - identical config to k8s/04-web.yaml, see the comment
            # there. The worker sends most push notifications (30s tick), so it's just as
            # necessary here as in the web pod (which e.g. sends new personal-best pushes
            # immediately, SessionsController.SendNewRecordPushAsync).
            - name: Apns__KeyPath
              value: /secrets/apns/apns-key.p8
            - name: Apns__KeyId
              value: "9L4T424GJM"
            - name: Apns__TeamId
              value: "GAP8W46W8A"
            - name: Apns__BundleId
              value: app.studylife.mobile
            - name: Apns__UseSandbox
              value: "true"
            # Redis AUTH password, read from the SAME Secret the Redis StatefulSet uses
            # (k8s/03-redis.yaml, secret "redis-auth", key "password") and merged into the
            # connection options by Program.cs (Cache:Password). optional: the Secret may not
            # exist yet - AUTH stays off until the operator creates it AND enables requirepass in
            # 03-redis.yaml (docs/SCALING.md "Redis AUTH"), in either order, without a crash-loop.
            - name: Cache__Password
              valueFrom:
                secretKeyRef: {name: redis-auth, key: password, optional: true}
            # The dedicated ACL user the app authenticates as (Program.cs Cache:User) - created
            # on the Redis side by the `--user` line in k8s/03-redis.yaml from the same Secret.
            - name: Cache__User
              valueFrom:
                secretKeyRef: {name: redis-auth, key: username, optional: true}
            # DataProtection key-ring-at-rest encryption (Program.cs, ProtectKeysWithCertificate)
            # - identical to k8s/04-web.yaml, required whenever Cache__Provider=Redis. The
            # worker runs the same AddDataProtection() setup as web (shared Program.cs), so it
            # needs the same certificate mounted here too, not just in the web pod.
            - name: DataProtection__CertPath
              value: /etc/studylife-dataprotection-tls/tls.crt
            - name: DataProtection__KeyPath
              value: /etc/studylife-dataprotection-tls/tls.key
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
          # Audit finding O6: both probes now point at /healthz/live (HealthController), NOT
          # /healthz/ready - deliberately, for two independent reasons:
          # 1. This Deployment has no Service (see the class comment above) - "Ready" has no
          #    routing meaning for the worker, and gating it on the DB adds a false-failure mode
          #    (a rolling update pauses on "not Ready" even though the worker can happily wait) for
          #    no actual benefit.
          # 2. Database__Migrate=false above means this process does NOT migrate itself - it
          #    BLOCKS in WaitForPendingMigrationsAsync (Program.cs) until the web Deployment's
          #    migration lands, up to a hard 5-minute (300s) deadline, ALL of it before app.Run()
          #    is even reached - so Kestrel isn't listening on ANY path, /healthz/ready included,
          #    for however long that wait takes. Using the DB-aware endpoint here would make
          #    readiness fail for a reason that has nothing to do with THIS pod being unhealthy.
          #
          # The startupProbe below is the actual fix for the timing hazard this wait loop
          # creates: without it, the old defaults (livenessProbe initialDelaySeconds: 20,
          # periodSeconds: 10, the implicit default failureThreshold: 3) would start failing at
          # t=20s and kill/restart the pod by ~t=40-50s - LONG before a slow web migration could
          # ever finish waiting out its 5-minute budget, turning a legitimate wait into a
          # perpetual CrashLoopBackOff. A startupProbe suspends BOTH readiness and liveness
          # checking until it succeeds once (or the pod is killed after its own failureThreshold),
          # so liveness/readiness below can keep their normal, tight timing for steady-state
          # operation once the wait is over.
          startupProbe:
            httpGet: {path: /healthz/live, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
            # 40 * 10s = 400s of budget - comfortably above the 300s WaitForPendingMigrationsAsync
            # deadline plus headroom for Kestrel/JIT startup and container scheduling jitter. If
            # the web role's migration is ever stuck/failed for the full 5 minutes, this pod is
            # killed and restarted (fresh 400s budget) rather than left in permanent limbo -
            # matching the crash-and-retry behavior WaitForPendingMigrationsAsync's own thrown
            # InvalidOperationException already produces once Program.cs actually reaches it.
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /healthz/live, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz/live, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: apns-key
              mountPath: /secrets/apns
              readOnly: true
            - name: dataprotection-tls
              mountPath: /etc/studylife-dataprotection-tls
              readOnly: true
      volumes:
        - name: apns-key
          secret: {secretName: studylife-apns}
        - name: dataprotection-tls
          secret: {secretName: studylife-dataprotection-tls}
