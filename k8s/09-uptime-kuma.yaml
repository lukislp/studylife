# IMPORTANT, incident found live (see the identical comment in k8s/17-grafana.yaml): NEVER
# apply this file directly to prod via "kubectl apply -f k8s/09-uptime-kuma.yaml" - the
# placeholder hostnames ("uptime.example.invalid"/"uptime-public.example.invalid") are ONLY
# replaced by bootstrap-cluster.ps1's -UptimeKumaHost/-UptimeKumaPublicHost parameters. For
# targeted changes: "kubectl patch" against the ingress/deployment individually.
#
# Lightweight outage notification, independent of the metrics pipeline (Grafana Cloud, see
# docs/SCALING.md) - pure HTTP healthcheck monitoring + push/email/webhook on outage. Needs NO
# external account (unlike Grafana Cloud/Cloudflare R2), so it can already be used live here.
# One-time manual setup AFTER the first start: open the web UI at the ingress path set up
# below, create an admin account, configure a monitor for
# "https://studylife-web.studylife-scale.svc.cluster.local" (or the external hostname)
# + a notification channel (e.g. ntfy.sh, email, webhook).
#
# Backend TLS for the ingress-nginx -> Uptime Kuma hop: contrary to what was originally assumed,
# Uptime Kuma has natively supported its own TLS since v1.x via UPTIME_KUMA_SSL_KEY/
# UPTIME_KUMA_SSL_CERT (no reverse-proxy sidecar needed, see
# https://github.com/louislam/uptime-kuma/wiki/Environment-Variables) - this switches the single
# port 3001 entirely to HTTPS (like Grafana/GF_SERVER_PROTOCOL), so the readiness probe and
# ingress backend protocol are switched along with it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uptime-kuma-backend-tls
  namespace: studylife-scale
spec:
  secretName: uptime-kuma-backend-tls
  dnsNames:
    - uptime-kuma.studylife-scale.svc.cluster.local
    - uptime-kuma
  issuerRef:
    name: studylife-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: studylife-scale
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: studylife-scale
spec:
  replicas: 1 # deliberately just 1 - pure observer, no app user data, no HA need
  strategy:
    type: Recreate # single instance with an RWO volume, like Postgres before the CNPG switch
  selector:
    matchLabels: { app: uptime-kuma }
  template:
    metadata:
      labels: { app: uptime-kuma }
    spec:
      # Uptime Kuma doesn't need Kubernetes API access (only checks HTTP/TCP endpoints).
      automountServiceAccountToken: false
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2
          env:
            - { name: UPTIME_KUMA_SSL_KEY, value: /etc/uptime-kuma-backend-tls/tls.key }
            - { name: UPTIME_KUMA_SSL_CERT, value: /etc/uptime-kuma-backend-tls/tls.crt }
            # v2.3.0+ on Raspberry Pi: SQLite locking issues are possible, officially recommended
            # workaround per the upstream wiki (https://github.com/louislam/uptime-kuma/wiki/Docker-Tags).
            - { name: UPTIME_KUMA_SQLITE_SINGLE_CONNECTION, value: "true" }
          ports:
            - containerPort: 3001
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            limits: { cpu: 200m, memory: 200Mi }
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: backend-tls
              mountPath: /etc/uptime-kuma-backend-tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /, port: 3001, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: uptime-kuma-data }
        - name: backend-tls
          secret: { secretName: uptime-kuma-backend-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: studylife-scale
spec:
  selector: { app: uptime-kuma }
  ports:
    - port: 80
      targetPort: 3001
# Ingress object removed (ingress-nginx decommissioned, see docs/SCALING.md "Migration to
# NGINX Gateway Fabric completed") - routing now runs exclusively via the HTTPRoute in
# k8s/07d-httproutes.yaml.
