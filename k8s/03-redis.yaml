# Real Redis cluster (3 masters + 3 replicas) instead of a single instance - all Redis usage in
# the code (IDistributedCache Get/Set per key in CacheHelper.cs, RedisVersionCounter.cs as a
# pure INCR/GET per key) is single-key, so it's 1:1 compatible with cluster slots, with no code
# changes at all - see docs/SCALING.md. No Helm available in the cluster, so hand-built as a
# StatefulSet instead of e.g. the Bitnami chart; functionally the same result.
#
# TLS for the client hop (app<->Redis) - certificate from the same cluster-internal CA as the
# other backend certificates (k8s/07b-cert-manager-issuers.yaml). ONE certificate for all 6 pods
# (DNS names of all pods + a wildcard as SAN) instead of 6 individual ones - Redis pods are
# configured identically via a shared ConfigMap/secret volume anyway, a per-pod certificate
# would only add unnecessary complexity (6 Certificate resources) without a real security gain
# (same internal CA, same trust domain).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-tls
  namespace: studylife-scale
spec:
  secretName: redis-tls
  dnsNames:
    - redis-cluster.studylife-scale.svc.cluster.local
    - "*.redis-cluster.studylife-scale.svc.cluster.local"
  issuerRef:
    name: studylife-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: studylife-scale
data:
  redis.conf: |
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    appendonly no
    dir /data
    # Pure cache with no persistent required data (see IDistributedCache/RedisVersionCounter) -
    # eviction under memory pressure is unproblematic here, a lost cache entry invalidates one
    # time too many at worst, never incorrectly. maxmemory chosen to fit under the 128Mi
    # container limit below.
    maxmemory 96mb
    # volatile-lru, not allkeys-lru (2026-09 audit): only keys WITH a TTL are eviction
    # candidates. That protects the DataProtection key ring (dataprotection:keys, no TTL) and the
    # per-user cache version counters from being evicted under memory pressure - with allkeys-lru
    # a burst of cache writes could silently drop the key ring and invalidate every protected
    # payload across all pods. Everything that is a real cache (CacheHelper entries, WebAuthn
    # challenges, consent assertions, rate-limit windows, shard leases) carries a TTL and stays
    # evictable exactly as before.
    maxmemory-policy volatile-lru
    # Client TLS (app<->Redis) active, cluster bus (Redis<->Redis gossip/replication)
    # DELIBERATELY still plaintext - tested live locally and reverted: "tls-cluster yes" via a
    # rolling update across all 6 pods reliably breaks the gossip protocol (cluster_state:fail,
    # stale IP/port entries in the node table, no self-healing even after several minutes) -
    # this hand-built, pod-IP-based cluster setup (no cluster-announce-hostname) can't tolerate
    # the bus protocol change during a sequential rollout. On prod with real user data this
    # would be a genuine outage risk - deliberately NOT implemented, see docs/SCALING.md for the
    # details of the failed attempt. The cluster bus stays cluster-internal only, between the
    # redis-cluster pods themselves anyway (NetworkPolicy already restricts this tightly) - the
    # connection actually worth protecting (app<->Redis, where real cache/session data flows) is
    # already encrypted via tls-port.
    tls-port 6380
    tls-cluster no
    tls-cert-file /tls/tls.crt
    tls-key-file /tls/tls.key
    tls-ca-cert-file /tls/ca.crt
    tls-auth-clients no
    # Audit finding O6 (round 2): TLS above encrypts the App<->Redis hop, but nothing has ever
    # required a PASSWORD on that hop - anyone who can reach the client port (6379 plaintext or
    # 6380 TLS) at all, e.g. via a compromised pod already inside the NetworkPolicy allowlist,
    # can read/write every key. AUTH is deliberately OPT-IN, not enabled here: this ConfigMap
    # stays a plain, non-secret text blob (no way to reference a Kubernetes Secret from inside a
    # ConfigMap's data), so the password is intentionally NOT a "requirepass"/"masterauth" line
    # in this file at all - it's appended as a command-line override instead (redis-server accepts
    # "config-file --flag value", CLI flags win over the file), sourced from a Secret via
    # secretKeyRef on the container below. See "Redis AUTH (Opt-In)" in docs/SCALING.md for the
    # full, ordered enable procedure - commented-out wiring for the StatefulSet container, the
    # redis-cli probes, and the redis_exporter sidecar is right where each applies below.
    # DEFAULT STAYS NO-AUTH: applying this file unchanged is a no-op, nothing below is active
    # until an operator deliberately follows that procedure.
---
# Headless service (clusterIP: None) - gives every pod a stable DNS identity
# (redis-cluster-N.redis-cluster.studylife-scale.svc.cluster.local), which the cluster bus
# communication between nodes needs. Port 16379 is the internal cluster bus (client port +
# 10000), not used by the app.
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: studylife-scale
spec:
  clusterIP: None
  selector: { app: redis-cluster }
  ports:
    - name: client
      port: 6379
    - name: bus
      port: 16379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: studylife-scale
spec:
  serviceName: redis-cluster
  # 6 replicas (3 masters + 3 replicas) - real redundancy restored, now with actual benefit: the
  # asymmetric hardware (pinode01 4GB, pinode02 8GB) provides enough buffer for a replica to
  # actually land on the OTHER node from its corresponding master, rather than just standing
  # next to it symbolically. New pods (replicas) added to the existing cluster topology via
  # "redis-cli --cluster add-node --cluster-slave" instead of a fresh bootstrap - the 3 existing
  # masters remain untouched in the process (cluster bus gossip reacts sensitively to
  # simultaneous IP changes of multiple nodes, see docs/SCALING.md).
  replicas: 6
  selector:
    matchLabels: { app: redis-cluster }
  template:
    metadata:
      labels: { app: redis-cluster }
    spec:
      # Redis needs no Kubernetes API access whatsoever - token automount explicitly off
      # (defense in depth, prevents misuse of a mounted API token by a compromised pod).
      automountServiceAccountToken: false
      # Soft (preferred), not hard - see the k8s/04-web.yaml comment. With 6 pods across e.g. 4
      # nodes, at least 2 nodes will get 2 pods each anyway, but the anti-affinity still helps
      # the scheduler avoid placing a master and its corresponding replica (from "redis-cli
      # --cluster create --cluster-replicas 1") on the same node as much as possible -
      # otherwise a node failure would hit master+replica simultaneously and Redis's own
      # redundancy would be ineffective.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: redis-cluster }
                topologyKey: kubernetes.io/hostname
      initContainers:
        # /data was written by the root era (the explicit redis-server command
        # bypasses the image entrypoint's own user drop, so the process really
        # ran as root); chown on every start - idempotent - so the non-root
        # redis below keeps writing its dump and cluster state. The only root
        # in the pod.
        - name: fix-data-ownership
          image: busybox:1.36.1
          command: ["chown", "-R", "999:999", "/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: redis
          image: redis:7-alpine
          # Redis AUTH (audit O6 round 2, enabled 2026-09 via the zero-downtime ACL path in
          # docs/SCALING.md "Redis AUTH"): requirepass locks the default user, masterauth lets
          # each replica keep authenticating to its master (replication runs over the regular
          # data port as a normal client; the cluster BUS on 16379 has no AUTH at all and stays
          # protected by the NetworkPolicy alone), and the `user` line creates the dedicated ACL
          # user the app authenticates as (k8s/04-web.yaml / 05-worker.yaml Cache__User +
          # Cache__Password, Program.cs). All three read the ONE `redis-auth` Secret, so the
          # app and Redis can never disagree about the password again (the 2026-08-27 attempt
          # failed exactly there). Each ACL rule token is its own argv element on purpose:
          # redis-server joins them into `user studylife on >… ~* &* +@all`; one quoted argv with
          # spaces would become a single quoted token and a user literally named "studylife on …".
          # "$(REDIS_PASSWORD)"/"$(REDIS_USERNAME)" are Kubernetes' own args substitution (no shell).
          # --cluster-announce-ip: without it a node keeps the pod IP it had when it FIRST joined
          # in nodes.conf ("myself") and keeps advertising that dead address in CLUSTER NODES
          # after every pod IP change - found 2026-09-04: four of six nodes announced IPs from
          # the previous afternoon, StackExchange.Redis in every web/worker pod looped on
          # connects to them (tens of SocketExceptions per second, request latency on the phone).
          # The pod IP is the right announce address for this pod-IP-based cluster.
          command: ["redis-server", "/usr/local/etc/redis/redis.conf",
            "--cluster-announce-ip", "$(POD_IP)",
            "--requirepass", "$(REDIS_PASSWORD)", "--masterauth", "$(REDIS_PASSWORD)",
            "--user", "$(REDIS_USERNAME)", "on", ">$(REDIS_PASSWORD)", "~*", "&*", "+@all"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-auth, key: password }
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef: { name: redis-auth, key: username }
          # Accepted tradeoff: "$(REDIS_PASSWORD)" expands into the actual process command line,
          # so the plaintext password becomes visible to anything that can already exec into this
          # pod (e.g. "ps aux", /proc/1/cmdline) - same trust boundary as every other
          # "encryption against network eavesdropping, not against a compromised pod" tradeoff
          # already made throughout this file (TLS certificate validation, the ingress-nginx ->
          # backend hop). It is NOT visible in the pod spec/"kubectl get pod -o yaml" itself
          # (only the secretKeyRef reference is), and not in this ConfigMap.
          # 999 is the image's own redis user - starting as it directly instead
          # of relying on an entrypoint drop the explicit command bypasses.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          ports:
            - containerPort: 6379
            - containerPort: 16379
            - containerPort: 6380 # TLS client port, migration phase 1 (dual-stack, see ConfigMap)
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
          # With requirepass active a bare "ping" answers NOAUTH (redis-cli exits non-zero) and
          # would mark every pod NotReady. "sh -c" is needed here, unlike the command/args field
          # above: exec probe commands are NOT subject to Kubernetes' "$(VAR)" substitution, only a
          # real shell expands "$VAR" - the probe process inherits this container's env.
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
        # Sidecar instead of a separate deployment - one exporter per Redis pod, connects to its
        # own Redis process via localhost. "--check-keys=worker:shard:*" exports the existing
        # shard-claim keys (see RedisWorkerShardClaim.cs) directly as a Prometheus metric,
        # WITHOUT any app code change - the basis of the worker shard dashboard.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.66.0
          # With requirepass active this exporter needs the password too, or every scrape fails
          # (NOAUTH) and the shard-claim dashboard silently goes stale while the exporter's OWN
          # /health below stays green (it only checks the exporter process, not its Redis link).
          args:
            - --redis.addr=redis://localhost:6379
            - --redis.password=$(REDIS_PASSWORD)
            - --check-keys=worker:shard:*
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-auth, key: password }
          ports:
            - containerPort: 9121
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          # The exporter image is scratch-based and already runs as its own
          # non-root user - declared so the posture is enforced, not
          # incidental. /health verified live before writing this down.
          securityContext:
            runAsNonRoot: true
            runAsUser: 59000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /health, port: 9121 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 9121 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: redis-cluster-config }
        - name: tls
          secret: { secretName: redis-tls }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml)
        # instead of local-path - migrated 2026-08-25 node by node (StatefulSet recreated with
        # --cascade=orphan so existing pods/PVCs were untouched by the template change itself,
        # then each pod+PVC deleted one at a time: replicas first via a plain "redis-cli
        # --cluster add-node --cluster-slave" rejoin, masters only after a graceful "cluster
        # failover" onto their already-migrated replica). volumeClaimTemplates is immutable on
        # a live StatefulSet, and a fresh pod's data dir comes up as an empty, unclustered node
        # (no CNPG-style auto-reclone) - unlike everything else migrated tonight, this data is
        # pure disposable cache (appendonly no) with its own master/replica redundancy already,
        # so the storage-class change is redundancy-on-redundancy, not a durability fix.
        storageClassName: longhorn
        resources:
          requests: { storage: 256Mi }
