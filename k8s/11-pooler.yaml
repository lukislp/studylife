# Connection pooler in front of Postgres - relevant because otherwise, as the web replica count
# grows, every pod would open its own Npgsql connection pool against CNPG's max_connections.
# CNPG automatically creates a Service with the same name as this Pooler object (NO "-rw"
# suffix, unlike the cluster itself - verified live: "studylife-pg-pooler", not
# "studylife-pg-pooler-rw"), 2 PgBouncer instances for its own redundancy. Transaction pooling
# mode (instead of session) - a connection is only bound to a client for the duration of ONE
# transaction, then released immediately.
#
# IMPORTANT GOTCHA (to be verified empirically, see docs/SCALING.md): PgBouncer in transaction
# mode doesn't support server-side prepared-statement caching across connection boundaries -
# Npgsql needs "Max Auto Prepare=0" in the connection string for this
# (k8s/01-config-and-secret.yaml), otherwise "prepared statement already exists" errors threaten.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: studylife-pg-pooler
  namespace: studylife-scale
spec:
  cluster:
    name: studylife-pg
  # Back to 2 instances (was 1, "resource-saving profile" in docs/SCALING.md). The single
  # instance turned out to have a cost the lean profile didn't account for: the
  # studylife-pg-pooler PDB (k8s/10-pod-disruption-budgets.yaml, minAvailable: 1 of 1) reported
  # disruptionsAllowed: 0 permanently, so "kubectl drain" of whichever node happened to hold the
  # pooler blocked indefinitely and needed manual intervention (delete the PDB, drain, put it
  # back). Dropping or loosening that PDB instead is not an option - this proxy is the app's ONLY
  # configured path to Postgres (Database__ConnectionString), losing it fails every read/write.
  # With 2 instances minAvailable: 1 becomes satisfiable: a drain evicts one and keeps serving on
  # the other. Cost: one more 25m CPU / 32Mi RAM pod (resources block below).
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
  # The only deployment in the cluster without requests/limits (found live) - PgBouncer is a
  # lean, pure proxy, values roughly analogous to Redis (k8s/03-redis.yaml), if anything lighter.
  template:
    spec:
      # Soft (preferred) instead of hard (required) anti-affinity, same reasoning as
      # k8s/04-web.yaml: spreads the 2 instances across nodes when several are available, but
      # does not leave the 2nd one Pending forever on a single-node setup. Without this both
      # could land on the same node, which would put the PDB back to blocking that node's drain.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { cnpg.io/poolerName: studylife-pg-pooler }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pgbouncer
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          # CNPG's generated pooler ships a readiness probe but no liveness -
          # a TCP check on the PgBouncer port is the honest option (its
          # protocol is Postgres, not HTTP).
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 10
            periodSeconds: 15
