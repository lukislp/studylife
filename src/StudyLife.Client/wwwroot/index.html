<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StudyLife</title>
    <base href="/" />
    <!-- Self-hosted fonts (see base.css): preloading the two latin faces every page renders with
         lets the browser fetch them in parallel with the CSS instead of after it. -->
    <link rel="preload" href="fonts/dmsans-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/dmmono-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Only what the boot screen and the app shell need blocks the first paint. The page-
         specific sheets (dashboard, stats, calendar, ...) are appended by js/boot-loading.js
         without blocking - they are long downloaded by the time the WASM runtime has booted and
         renders the first page (2026-09 audit L4). print.css only applies when printing. -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/print.css" media="print" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <meta name="theme-color" content="#0e0e0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StudyLife" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
    <div id="app">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;background:#0e0e0f;color:#e8e6e0">
            <div style="text-align:center">
                <div style="font-size:2rem;margin-bottom:1rem;color:#CC785C">✦</div>
                <div id="boot-loading-text" style="font-size:0.875rem;color:#6b6965;letter-spacing:0.05em">Loading StudyLife</div>
            </div>
        </div>
    </div>

    <!-- Kept as an external file (not inline) so script-src can drop 'unsafe-inline' - see
         Program.cs CSP comment. Order preserved: fired in parallel with the WASM download,
         before Blazor itself. -->
    <script src="js/boot-loading.js"></script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- autostart="false": boot-start.js calls Blazor.start() itself right after this loads -
         the ONLY reason is loadBootResource, the sole hook into the wasm-download/runtime-init
         phase for the boot timeline telemetry (docs/ARCHITECTURE.md "Telemetry", phase 2). -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/boot-start.js"></script>
    <!-- All JS interop functions used via IJSRuntime.Invoke(Void)Async by bare name (error
         diagnostics banner, scroll helpers, calendar swipe, cross-tab write-queue lock,
         completion sound, wake lock, theme/culture, notifications, push, service worker
         registration, global search hotkey, TTS speakText, voice dictation, client telemetry) -
         moved out of index.html into this external classic script so script-src can drop
         'unsafe-inline'. Being a classic (non-module) script, top-level function declarations
         still land on window exactly as they did inline, so every existing
         InvokeVoidAsync("functionName") call site keeps working unchanged. -->
    <script src="js/interop.js"></script>
</body>
</html>
